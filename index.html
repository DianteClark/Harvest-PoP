*{box-sizing:border-box}
:root{--ink:#3a2216;--cream:#fff7e3;--font:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
html,body{margin:0;height:100%;overflow:hidden;background:#6fcbff;font-family:var(--font);color:var(--ink);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;overscroll-behavior:none;-webkit-touch-callout:none}
button{font-family:inherit;cursor:pointer;color:inherit;-webkit-tap-highlight-color:transparent}
img{-webkit-user-drag:none;user-select:none;pointer-events:none}
#cv{position:fixed;left:0;top:0;z-index:1;touch-action:none;display:none}
#bgcv,#tilecv{position:fixed;left:0;top:0;z-index:1;pointer-events:none;display:none}
.scr{position:fixed;inset:0;display:none;z-index:2}
.scr.on{display:block}
.stk{color:#fff;text-shadow:0 2px 0 var(--ink),2px 0 0 var(--ink),-2px 0 0 var(--ink),0 -2px 0 var(--ink),1.5px 1.5px 0 var(--ink),-1.5px 1.5px 0 var(--ink),1.5px -1.5px 0 var(--ink),-1.5px -1.5px 0 var(--ink),0 4px 0 var(--ink)}
.stk2{text-shadow:0 3px 0 var(--ink),3px 0 0 var(--ink),-3px 0 0 var(--ink),0 -3px 0 var(--ink),2.2px 2.2px 0 var(--ink),-2.2px 2.2px 0 var(--ink),2.2px -2.2px 0 var(--ink),-2.2px -2.2px 0 var(--ink),
  0 8px 0 #fff,7px 0 0 #fff,-7px 0 0 #fff,0 -7px 0 #fff,5px 5px 0 #fff,-5px 5px 0 #fff,5px -5px 0 #fff,-5px -5px 0 #fff,0 13px 0 rgba(58,34,22,.35)}
.card{background:var(--cream);border:4px solid #fff;border-radius:24px;box-shadow:0 0 0 3px var(--ink),0 8px 0 3px rgba(58,34,22,.28)}
.btn{font-size:22px;border:4px solid #fff;border-radius:20px;padding:10px 22px;background:linear-gradient(#8ae866,#38a52a);color:#fff;box-shadow:0 0 0 3px var(--ink),0 6px 0 3px var(--ink);transform:translateY(0);transition:transform .06s,box-shadow .06s;display:inline-flex;align-items:center;justify-content:center;gap:6px;
  text-shadow:0 2px 0 var(--ink),2px 0 0 var(--ink),-2px 0 0 var(--ink),0 -2px 0 var(--ink),1.5px 1.5px 0 var(--ink),-1.5px 1.5px 0 var(--ink),1.5px -1.5px 0 var(--ink),-1.5px -1.5px 0 var(--ink)}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 3px var(--ink),0 2px 0 3px var(--ink)}
.btn.orange{background:linear-gradient(#ffc961,#f57c00)}
.btn.blue{background:linear-gradient(#8fc0ff,#2f6fd6)}
.btn.red{background:linear-gradient(#ff8a96,#d8203d)}
.btn.gray{background:linear-gradient(#d4d4d4,#9a9a9a)}
.btn.big{font-size:28px;padding:12px 40px}
.btn.sm{font-size:17px;padding:6px 12px;border-radius:14px;border-width:3px}
.btn img.bi{width:34px;height:34px;margin:-6px 0}
.btn img.mini{width:22px;height:22px}
.pillc{font-size:14px;background:rgba(58,34,22,.35);border-radius:10px;padding:2px 8px;text-shadow:none}

/* ---------- title ---------- */
#scrTitle{background:radial-gradient(circle at 50% 28%,#e4f9ff 0,#8fd8ff 55%,#6fcbff 100%);overflow:hidden}
#logo{position:absolute;top:calc(var(--sat) + 13%);left:0;right:0;text-align:center;z-index:3;line-height:.95}
#logo span{display:inline-block;animation:wob 2.4s ease-in-out infinite}
#logo .l1{font-size:min(17vw,88px)}
#logo .l2{font-size:min(23vw,120px);margin-top:4px}
@keyframes wob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-7px) rotate(4deg)}}
.playWrap{position:absolute;left:0;right:0;bottom:calc(var(--sab) + 15%);text-align:center;z-index:4}
#btnPlay{font-size:36px;padding:14px 56px;animation:breathe 1.6s ease-in-out infinite}
@keyframes breathe{0%,100%{scale:1}50%{scale:1.06}}

/* ---------- top bar & tabs ---------- */
#topbar{position:fixed;top:0;left:0;right:0;z-index:6;display:none;justify-content:space-between;align-items:center;padding:calc(var(--sat) + 10px) 14px 8px;pointer-events:none}
#topbar.on{display:flex}
.pill{pointer-events:auto;display:flex;align-items:center;gap:6px;background:var(--cream);border:3px solid #fff;border-radius:999px;box-shadow:0 0 0 3px var(--ink),0 4px 0 3px rgba(58,34,22,.3);padding:3px 16px 3px 4px;font-size:22px}
.pill img{width:34px;height:34px}
.iconBtn{pointer-events:auto;width:48px;height:48px;border-radius:16px;border:3px solid #fff;background:linear-gradient(#8fc0ff,#2f6fd6);box-shadow:0 0 0 3px var(--ink),0 5px 0 3px var(--ink);padding:8px}
.iconBtn:active{transform:translateY(3px);box-shadow:0 0 0 3px var(--ink),0 2px 0 3px var(--ink)}
.iconBtn svg{width:100%;height:100%;display:block}
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:none;justify-content:center;gap:16px;padding:10px 12px calc(var(--sab) + 12px);pointer-events:none}
#tabs.on{display:flex}
.tab{pointer-events:auto;position:relative;width:118px;display:flex;align-items:center;justify-content:center;gap:4px;font-size:20px;padding:4px 10px 4px 4px;background:var(--cream);border:3px solid #fff;border-radius:20px;box-shadow:0 0 0 3px var(--ink),0 5px 0 3px var(--ink)}
.tab img{width:46px;height:46px}
.tab.sel{background:linear-gradient(#fff2a8,#ffd23a)}
.tab:active{transform:translateY(3px)}
.dot{position:absolute;top:-8px;right:-8px;width:22px;height:22px;border-radius:50%;background:#ff4d5e;border:3px solid #fff;box-shadow:0 0 0 2px var(--ink);display:none;animation:breathe 1s infinite}

/* ---------- map ---------- */
#scrMap{background:#78cf55}
#mapScroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;touch-action:pan-y;overscroll-behavior:contain}
#mapInner{position:relative;margin:0 auto;background:repeating-linear-gradient(180deg,#80d65c 0 70px,#78cf55 70px 140px)}
.road{position:absolute;left:0;top:0}
.decor{position:absolute;pointer-events:none}
.node{position:absolute;width:66px;height:66px;margin:-33px 0 0 -33px;border-radius:50%;border:4px solid #fff;box-shadow:0 0 0 3px var(--ink),0 6px 0 3px rgba(58,34,22,.4);background:radial-gradient(circle at 35% 30%,#a8f082,#38a52a);display:flex;align-items:center;justify-content:center;padding:0;z-index:2}
.node .num{font-size:30px}
.node.cur{background:radial-gradient(circle at 35% 30%,#ffd98a,#f57c00);animation:breathe 1.2s ease-in-out infinite}
.node.lock{background:radial-gradient(circle at 35% 30%,#e2e2e2,#a0a0a0)}
.node.lock .num{opacity:.85}
.node.boss{width:94px;height:94px;margin:-47px 0 0 -47px;background:radial-gradient(circle at 35% 30%,#ff9aa4,#d8203d)}
.node.boss.lock{background:radial-gradient(circle at 35% 30%,#e2b0b0,#9a6a6a)}
.node.boss img{width:84px;margin-top:-4px}
.node.boss.lock img{filter:grayscale(.6) brightness(.95)}
.bossTag{position:absolute;bottom:-14px;font-size:16px;background:#d8203d;border:2px solid #fff;border-radius:10px;padding:0 8px;box-shadow:0 0 0 2px var(--ink)}
.node .stars{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);display:flex}
.node.boss .stars{bottom:-34px}
.node .stars img{width:26px;height:26px;margin:0 -3px}
.node .stars img.off{filter:grayscale(1) brightness(1.5) opacity(.55)}
.marker{position:absolute;width:58px;margin-left:-29px;z-index:3;animation:hop .9s ease-in-out infinite}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.mapSign{position:absolute;left:50%;transform:translateX(-50%);font-size:26px;background:#c88a4e;border:3px solid #fff;border-radius:12px;padding:2px 16px;box-shadow:0 0 0 3px var(--ink)}

/* ---------- farm ---------- */
#scrFarm{background:linear-gradient(#8fd8ff 0,#b9ecff 120px,#86d662 121px,#78cf55 100%)}
#farmWrap{position:absolute;inset:0;overflow-y:auto;padding:calc(var(--sat) + 72px) 14px calc(var(--sab) + 110px);-webkit-overflow-scrolling:touch}
.farmTitle{font-size:38px;text-align:center}
.farmSub{text-align:center;font-size:16px;margin:4px auto 0;max-width:330px;color:#24400f}
#plots{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;max-width:430px;margin:18px auto}
.plot{aspect-ratio:1;border-radius:22px;border:4px solid #fff;box-shadow:0 0 0 3px var(--ink),0 6px 0 3px rgba(58,34,22,.35);background:repeating-linear-gradient(180deg,#a5683a 0 11px,#8e5530 11px 20px);position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;overflow:visible}
.plot:active{transform:scale(.96)}
.plot.lock{background:repeating-linear-gradient(180deg,#9c8a7a 0 11px,#8a786a 11px 20px)}
.plot img.crop{width:82%;margin-top:-14%}
.plot img.crop.sm{width:66%;margin-top:-22%}
.plot.ready{animation:glow 1.2s ease-in-out infinite}
.plot.ready img.crop{animation:hop 1s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 0 0 3px var(--ink),0 6px 0 3px rgba(58,34,22,.35)}50%{box-shadow:0 0 0 3px var(--ink),0 6px 0 3px rgba(58,34,22,.35),0 0 22px 8px #fff27a}}
.plot .lbl{position:absolute;bottom:6px;font-size:17px}
.plot .plus{font-size:44px;line-height:1}
.plot.empty .lbl{position:static}
.plot .tm{position:absolute;top:4px;font-size:15px}
.plot .bar{position:absolute;left:10px;right:10px;bottom:9px;height:13px;border-radius:8px;background:rgba(0,0,0,.35);border:2px solid #fff;box-shadow:0 0 0 2px var(--ink);overflow:hidden}
.plot .bar i{display:block;height:100%;background:linear-gradient(#a8f082,#38a52a);transition:width 1s linear}
.plot .water{position:absolute;top:-14px;right:-14px;width:46px;height:46px;animation:hop 1.4s ease-in-out infinite}
.plot .water img{width:100%}
.plot img.lk{width:46%}
.plot .cost{display:flex;align-items:center;font-size:18px;margin-top:2px}
.plot .cost img.ci{width:24px;height:24px}
.plot.splash::after{content:"";position:absolute;inset:-6px;border-radius:24px;background:radial-gradient(circle,rgba(150,210,255,.8),transparent 70%);animation:fade .6s forwards}
@keyframes fade{to{opacity:0}}
.shelf{max-width:430px;margin:18px auto;padding:10px 8px 6px}
.shelfT{text-align:center;font-size:20px;margin-bottom:4px}
.inv{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
.item{width:74px;text-align:center;position:relative;font-size:13px}
.item img{width:58px;height:58px}
.item .n{position:absolute;right:6px;top:36px;font-size:19px}
.item .nm{display:block;margin-top:-2px}
.bump{animation:bump .3s}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(1)}}
.flyer{position:fixed;z-index:50;pointer-events:none}

/* ---------- game HUD ---------- */
#scrGame{pointer-events:none}
#hud{position:absolute;top:0;left:0;right:0;padding:calc(var(--sat) + 10px) 10px 0;display:flex;gap:10px;align-items:stretch}
#hud>*{pointer-events:auto}
#btnPause{align-self:flex-start;flex:none;background:linear-gradient(#ffc961,#f57c00)}
#hudMoves{flex:none;width:88px;text-align:center;padding:2px 0 4px;display:flex;flex-direction:column;justify-content:center}
#hudMoves .lbl{font-size:13px;opacity:.75;line-height:1.1}
#movesNum{font-size:38px;line-height:1}
#movesNum.low{color:#ff6a78;animation:breathe .7s infinite}
#hudGoals{flex:1;display:flex;align-items:center;justify-content:space-evenly;padding:4px 4px;min-height:74px}
.goal{position:relative;display:flex;flex-direction:column;align-items:center;min-width:48px}
.goal img{width:48px;height:48px}
.goal .gn{font-size:21px;margin-top:-10px}
.goal .ck{display:none;position:absolute;right:-4px;bottom:-2px;width:26px;height:26px}
.goal .ck svg{width:100%;height:100%}
.goal.done .gn{visibility:hidden}
.goal.done .ck{display:block}
#gameBottom{position:absolute;left:0;right:0;bottom:0;padding:0 14px calc(var(--sab) + 14px);display:flex;justify-content:center;align-items:flex-end;gap:14px}
.boostBtn{pointer-events:auto;width:68px;height:68px;border-radius:22px;background:var(--cream);border:4px solid #fff;box-shadow:0 0 0 3px var(--ink),0 6px 0 3px var(--ink);position:relative;padding:0;display:flex;align-items:center;justify-content:center}
.boostBtn:active{transform:translateY(3px)}
.boostBtn img{width:54px}
.boostBtn.on{background:linear-gradient(#fff2a8,#ffd23a);animation:breathe .8s infinite}
.boostBtn.empty img{filter:grayscale(.8);opacity:.6}
.cnt{position:absolute;right:-8px;top:-8px;min-width:26px;height:26px;border-radius:13px;background:#ff4d5e;color:#fff;font-size:16px;line-height:20px;border:3px solid #fff;box-shadow:0 0 0 2px var(--ink);padding:0 4px;text-align:center}
#shovelTip,#gameTip{position:absolute;left:50%;bottom:calc(var(--sab) + 96px);transform:translateX(-50%) scale(.6);opacity:0;transition:.2s;white-space:nowrap;font-size:19px;background:var(--cream);border:3px solid #fff;border-radius:16px;box-shadow:0 0 0 3px var(--ink);padding:6px 16px;pointer-events:none}
#shovelTip.on,#gameTip.on{opacity:1;transform:translateX(-50%) scale(1)}

/* ---------- popups ---------- */
#pop{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;background:rgba(30,18,8,.5);padding:26px 16px}
#pop.on{display:flex}
.pcard{width:min(92vw,390px);max-height:calc(100dvh - 60px);overflow-y:auto;padding:12px 16px 20px;text-align:center;position:relative;animation:popin .38s cubic-bezier(.2,1.5,.4,1);overflow-x:visible}
@keyframes popin{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
.ribbon{display:inline-block;font-size:28px;background:linear-gradient(#8fc0ff,#2f6fd6);border:4px solid #fff;border-radius:18px;box-shadow:0 0 0 3px var(--ink),0 5px 0 3px var(--ink);padding:4px 22px;margin:4px auto 10px;max-width:100%}
.ribbon.red{background:linear-gradient(#ff8a96,#d8203d)}
.ribbon.green{background:linear-gradient(#8ae866,#38a52a)}
.pcard h3{font-size:26px;margin:4px 0 2px;font-weight:normal}
.pcard p{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-weight:600;font-size:16px;line-height:1.4;margin:8px 4px;color:#4a2e1e}
.sub{font-size:18px;margin:8px 0 4px}
.sub.small{font-size:15px;opacity:.8}
.introImg img{width:120px;height:120px;animation:hop 1.2s ease-in-out infinite}
.btns{display:flex;gap:14px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.btns.col{flex-direction:column;align-items:stretch;padding:0 16px}
.xbtn{position:absolute;top:8px;right:8px;width:40px;height:40px;border-radius:50%;border:3px solid #fff;background:linear-gradient(#ff8a96,#d8203d);box-shadow:0 0 0 3px var(--ink);padding:6px}
.xbtn svg{width:100%;height:100%;display:block}
.goalRow{display:flex;justify-content:center;gap:14px;flex-wrap:wrap}
.gchip{display:flex;flex-direction:column;align-items:center}
.gchip img{width:60px;height:60px}
.gchip .stk{font-size:22px;margin-top:-10px}
.gchip .stk.sm{font-size:16px}
.boostPick{display:flex;justify-content:center;gap:16px;margin-top:6px}
.bpick{width:72px;height:72px;border-radius:20px;background:#fff;border:4px solid #fff;box-shadow:0 0 0 3px var(--ink);position:relative;padding:0}
.bpick img{width:56px}
.bpick.empty img{filter:grayscale(1);opacity:.45}
.bpick.on{background:linear-gradient(#fff2a8,#ffd23a)}
.bpick .tick{display:none;position:absolute;left:-10px;top:-10px;width:28px;height:28px}
.bpick.on .tick{display:block}
.bpick .tick svg{width:100%}
.starRow{display:flex;justify-content:center;align-items:flex-end;gap:2px;margin:4px 0}
.bigstar{width:84px;height:84px;opacity:0;animation:starIn .45s cubic-bezier(.2,1.8,.4,1) forwards}
.bigstar:nth-child(2){width:104px;height:104px;margin-bottom:10px}
.bigstar.off{filter:grayscale(1) brightness(1.5);opacity:.4!important;animation:none}
@keyframes starIn{from{transform:scale(2.5) rotate(-40deg);opacity:0}to{transform:scale(1);opacity:1}}
.score{font-size:24px}
.rewards{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
.rw{display:flex;flex-direction:column;align-items:center;min-width:64px}
.rw img{width:58px;height:58px}
.rw .stk{font-size:20px;margin-top:-6px}
.rw .stk.sm{font-size:15px}
.seedList{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.seedRow{display:flex;align-items:center;gap:8px;background:#fff;border-radius:16px;padding:6px 10px 6px 4px;box-shadow:0 0 0 2px rgba(58,34,22,.2);text-align:left}
.seedRow img.pk{width:54px;height:54px;flex:none}
.sinfo{flex:1;display:flex;flex-direction:column;font-size:14px;line-height:1.25}
.sinfo b{font-size:19px;font-weight:normal}
.sinfo img.mini{width:20px;height:20px;vertical-align:-4px}
.sinfo .own{opacity:.65;font-size:13px}
#toast{position:fixed;left:50%;top:calc(var(--sat) + 76px);transform:translate(-50%,-20px);opacity:0;z-index:40;background:var(--cream);border:3px solid #fff;border-radius:16px;box-shadow:0 0 0 3px var(--ink),0 5px 0 3px rgba(58,34,22,.3);padding:8px 16px;font-size:17px;text-align:center;width:max-content;max-width:88vw;transition:.25s;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- idle farm ---------- */
#fstats{display:flex;justify-content:center;gap:14px;font-size:15px;color:#24400f;margin-top:2px}
#fstats b{color:#c4400a}
#fgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:440px;margin:16px auto 0;padding:14px;border-radius:26px;background:repeating-linear-gradient(45deg,#8ee06a 0 14px,#84d860 14px 28px);border:4px solid #fff;box-shadow:0 0 0 3px var(--ink),0 8px 0 3px rgba(58,34,22,.3)}
.tile{aspect-ratio:1;position:relative;border:0;padding:0;border-radius:16px;background:transparent;display:flex;align-items:center;justify-content:center;flex-direction:column}
.tile:active{transform:scale(.95)}
.tile.grass{background:rgba(255,255,255,.18);border:3px dashed rgba(255,255,255,.75)}
.tplus{font-size:30px;color:rgba(255,255,255,.95);text-shadow:0 2px 0 rgba(58,34,22,.35)}
.tile.field{background:repeating-linear-gradient(180deg,#a5683a 0 9px,#8e5530 9px 16px);border:3px solid #fff;box-shadow:0 0 0 2.5px var(--ink),0 4px 0 2.5px rgba(58,34,22,.3)}
.tile.field .tplus{font-size:26px}
.tile .tl{position:absolute;bottom:3px;font-size:13px}
.tile img.crop{width:86%;margin-top:-18%}
.tile img.crop.sm{width:70%;margin-top:-26%}
.tile img.bimg{width:118%;max-width:none;margin-top:-22%}
.tile img.blades{position:absolute;width:86%;top:-30%;left:7%;animation:spin 3s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.tile .tm{position:absolute;top:2px;font-size:13px}
.tile .bar{position:absolute;left:6px;right:6px;bottom:6px;height:9px;border-radius:6px;background:rgba(0,0,0,.35);border:2px solid #fff;overflow:hidden}
.tile .bar i,.tile .mini i{display:block;height:100%;background:linear-gradient(#a8f082,#38a52a)}
.tile .mini{position:absolute;left:12%;right:12%;bottom:-4px;height:8px;border-radius:6px;background:rgba(58,34,22,.4);border:2px solid #fff;box-shadow:0 0 0 1.5px var(--ink);overflow:hidden}
.tile .mini i{transition:width 1s linear}
.tile .water{position:absolute;top:-12px;right:-12px;width:38px;height:38px;animation:hop 1.4s ease-in-out infinite}
.tile .water img{width:100%}
.bubble{position:absolute;top:-16px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:1px;background:#fff;border-radius:14px;padding:1px 7px 1px 2px;box-shadow:0 0 0 2.5px var(--ink),0 3px 0 2.5px rgba(58,34,22,.3);font-size:15px;animation:hop 1.2s ease-in-out infinite;z-index:2;white-space:nowrap}
.bubble img{width:24px;height:24px}
.bubble b{font-weight:normal}
.bubble.full{background:#fff2a8}
.fulltag{position:absolute;bottom:-6px;font-size:12px;background:#ff4d5e;border:2px solid #fff;border-radius:8px;padding:0 5px;box-shadow:0 0 0 1.5px var(--ink)}
.tile .lv{position:absolute;left:-4px;bottom:-6px;font-size:11px;background:#2f6fd6;border:2px solid #fff;border-radius:8px;padding:0 4px;box-shadow:0 0 0 1.5px var(--ink)}
.tile .mg{position:absolute;right:-8px;bottom:-8px;width:28px;height:28px}
.tile .mg img{width:100%}
.tile.ready{animation:glow 1.2s ease-in-out infinite;border-radius:16px}
.tile.pop{animation:popin .45s cubic-bezier(.2,1.6,.4,1)}
.tile.splash::after{content:"";position:absolute;inset:-6px;border-radius:18px;background:radial-gradient(circle,rgba(150,210,255,.85),transparent 70%);animation:fade .6s forwards}
#expand{display:flex;align-items:center;justify-content:center;gap:8px;margin:14px auto 0;width:min(100%,440px);font-size:18px;background:repeating-linear-gradient(45deg,#c7b59a 0 12px,#bba78a 12px 24px);border:3px dashed #fff;border-radius:18px;padding:6px;color:#fff;text-shadow:0 2px 0 var(--ink),2px 0 0 var(--ink),-2px 0 0 var(--ink),0 -2px 0 var(--ink)}
#expand img{width:34px;height:34px}
#expand .price{display:flex;align-items:center;background:rgba(58,34,22,.35);border-radius:10px;padding:0 8px 0 0}
#expand .price img{width:26px;height:26px}
.statRow{display:flex;justify-content:space-between;font-family:system-ui,sans-serif;font-weight:600;font-size:15px;background:#fff;border-radius:12px;padding:6px 12px;margin:6px 4px}
.statRow b{font-family:var(--font);font-weight:normal;font-size:17px}
.seedRow.locked{opacity:.6}
.lockmsg{font-size:13px;background:#eee;border-radius:10px;padding:4px 8px;white-space:nowrap}
.needs{display:flex;gap:6px;flex-wrap:wrap}
.need{display:inline-flex;align-items:center;font-size:14px}
.need img{width:22px;height:22px}
.need.short{color:#d8203d}
.seedRow .btn.sm+.btn.sm{margin-left:-2px}
.unlock{display:flex;align-items:center;gap:8px;background:linear-gradient(#fff2a8,#ffe066);border-radius:16px;padding:6px 12px;margin:12px 6px 0;text-align:left;box-shadow:0 0 0 2px rgba(58,34,22,.25)}
.unlock img{width:56px;height:56px}
.unlock div{display:flex;flex-direction:column;font-size:14px}
.unlock b{font-size:18px;font-weight:normal}

/* ---------- update 2 ---------- */
.pills{display:flex;gap:10px;pointer-events:auto}
.pills .pill{font-size:19px;padding-right:12px}
.pills .pill img{width:30px;height:30px}
.tbtns{display:flex;gap:10px}
#btnMusic{background:linear-gradient(#ff9ad8,#c43aa0);padding:6px}
#btnMusic img{width:100%;height:100%}
#btnMusic.off{filter:grayscale(1) brightness(1.1)}
#side{position:fixed;left:10px;top:calc(var(--sat) + 78px);z-index:6;display:none;flex-direction:column;gap:12px}
#side.on{display:flex}
.sbtn{position:relative;width:56px;height:56px;border-radius:20px;background:var(--cream);border:3px solid #fff;box-shadow:0 0 0 3px var(--ink),0 5px 0 3px rgba(58,34,22,.35);padding:2px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.sbtn img{width:38px;height:38px;margin-top:-4px}
.sbtn .stk{font-size:13px;margin-top:-6px}
.sbtn .dot{top:-6px;right:-6px}
.sbtn:active{transform:translateY(3px)}
.band{position:absolute;left:0;right:0}
.rsign{position:absolute;right:8px;z-index:1;background:linear-gradient(#d89a5a,#a8672f);border:3px solid #fff;border-radius:12px;box-shadow:0 0 0 3px var(--ink),0 5px 0 3px rgba(58,34,22,.3);padding:3px 12px;font-size:17px;transform:rotate(-4deg)}
.rsign::after{content:"";position:absolute;left:50%;top:100%;width:8px;height:22px;margin-left:-4px;background:#8a5430;border:2px solid var(--ink);border-top:0;z-index:-1}
.decor.frost{filter:saturate(.25) brightness(1.35) drop-shadow(0 -3px 0 #fff)}
.dgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
.dtile{position:relative;background:#fff;border-radius:14px;padding:6px 2px 8px;box-shadow:0 0 0 2px rgba(58,34,22,.2);display:flex;flex-direction:column;align-items:center;gap:2px}
.dtile b{font-weight:normal;font-size:14px}
.dtile.big{grid-column:1/-1;background:linear-gradient(#fff2a8,#ffd23a)}
.dtile.now{background:linear-gradient(#b7f59a,#6fd65a);animation:breathe 1s infinite;box-shadow:0 0 0 3px var(--ink)}
.dtile.got{opacity:.55}
.dch{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;font-size:14px}
.dch span{display:inline-flex;align-items:center}
.dch img{width:28px;height:28px}
.dtile .ck{position:absolute;right:4px;top:4px;width:22px;height:22px}
.dtile .ck svg{width:100%}
.wheelWrap{position:relative;width:min(78vw,300px);aspect-ratio:1;margin:6px auto 0;max-width:100%}
#wheelCv{width:100%;height:100%;display:block}
.wpointer{position:absolute;left:50%;top:-6px;width:34px;height:40px;margin-left:-17px;background:#ff4d5e;clip-path:polygon(0 0,100% 0,50% 100%);filter:drop-shadow(0 0 0 #fff)}
.wpointer::after{content:"";position:absolute;inset:4px 6px 10px;background:#ff8a96;clip-path:polygon(0 0,100% 0,50% 100%)}
.rewards.big .rw img{width:78px;height:78px}
.streak{background:linear-gradient(#ffe3c8,#ffc58f);border-radius:16px;margin:10px 6px 4px;padding:6px 8px;box-shadow:0 0 0 2px rgba(58,34,22,.2)}
.stT{font-size:17px;color:#c4400a}

function newFarm() {

}

  if (S.flvl == null) { S.flvl = 1; S.fxp = 0; }

function tickB(x, now) {

// reward: {coins, gems, items:{k:n}, seeds:n, res:{k:n}}
function grant(r) {
  const chips = [];
  if (r.coins) { S.coins += r.coins; chips.push(['coin', '+' + r.coins]); }
  if (r.gems) { S.gems += r.gems; chips.push(['gem', '+' + r.gems]); }
  for (const [k, n] of Object.entries(r.items || {})) { S.items[k] += n; chips.push([ITEMS[k].icon, '+' + n]); }
  for (let i = 0; i < (r.seeds || 0); i++) { const k = rollSeed(S.lvl); S.seeds[k]++; chips.push(['pk_' + k, CROPS[k].name]); }
  for (const [k, n] of Object.entries(r.res || {})) { S.res[k] += n; chips.push([k, '+' + n]); }
  if (r.pack) { S.packs = (S.packs || 0) + r.pack; chips.push(['pack', '+' + r.pack]); }
  if (r.tokens) { festPts(r.tokens); chips.push(['token', '+' + r.tokens]); }
  saveGame(); updateTop();
  return chips.map(([k, t]) => `<div class="rw">${img(k, '', 112)}<span class="stk ${t.length > 4 ? 'sm' : ''}">${t}</span></div>`).join('');
}
function rewardChips(r) {
  const out = [];
  if (r.coins) out.push(['coin', r.coins]); if (r.gems) out.push(['gem', r.gems]);
  for (const [k, n] of Object.entries(r.items || {})) out.push([ITEMS[k].icon, n]);
  if (r.seeds) out.push(['pk_carrot', r.seeds]);
  if (r.pack) out.push(['pack', r.pack]);
  return out;
}

// ---------- LUCKY WHEEL ----------
const WHEEL = [
  { r: { coins: 25 }, w: 20, col: '#ffd92e' }, { r: { items: { rocket: 1 } }, w: 14, col: '#ff9a1f' },
  { r: { coins: 60 }, w: 14, col: '#56c43a' }, { r: { seeds: 2 }, w: 15, col: '#4f7dff' },

];
const wheelFree = () => S.wheel !== today();
let wheelImgs = null;
function drawWheel(cv2) {
  const c = cv2.getContext('2d'), s = cv2.width, R = s / 2 - 10, n = WHEEL.length, seg = TAU / n;
  c.clearRect(0, 0, s, s);
  circ(c, s / 2, s / 2 + 5, R + 6); c.fillStyle = 'rgba(58,34,22,.3)'; c.fill();
  circ(c, s / 2, s / 2, R + 7); c.fillStyle = INK; c.fill();
  circ(c, s / 2, s / 2, R + 3); c.fillStyle = '#fff'; c.fill();
  WHEEL.forEach((w, i) => {
    const a0 = -Math.PI / 2 + i * seg - seg / 2;
    c.beginPath(); c.moveTo(s / 2, s / 2); c.arc(s / 2, s / 2, R, a0, a0 + seg); c.closePath();
    c.fillStyle = w.col; c.fill(); c.lineWidth = 3; c.strokeStyle = '#fff'; c.stroke();
    const [k, num] = rewardChips(w.r)[0];
    c.save(); c.translate(s / 2, s / 2); c.rotate(a0 + seg / 2 + Math.PI / 2);
    const im = wheelImgs[k]; if (im) c.drawImage(im, -R * 0.17, -R * 0.86, R * 0.34, R * 0.34);
    c.font = `${R * 0.13}px ${FONT}`; c.textAlign = 'center'; c.lineJoin = 'round';
    c.lineWidth = 5; c.strokeStyle = INK; c.strokeText(num, 0, -R * 0.4); c.fillStyle = '#fff'; c.fillText(num, 0, -R * 0.4);
    c.restore();
  });
  for (let i = 0; i < n; i++) { const a = -Math.PI / 2 + i * seg - seg / 2; circ(c, s / 2 + Math.cos(a) * (R + 1), s / 2 + Math.sin(a) * (R + 1), 5); c.fillStyle = '#ffd23a'; c.fill(); c.lineWidth = 2; c.strokeStyle = INK; c.stroke(); }
  circ(c, s / 2, s / 2, R * 0.16); c.fillStyle = '#fff'; c.fill(); c.lineWidth = 4; c.strokeStyle = INK; c.stroke();
}
async function loadWheelImgs() {
  if (wheelImgs) return;
  wheelImgs = {};
  const keys = [...new Set(WHEEL.map(w => rewardChips(w.r)[0][0]))];
  await Promise.all(keys.map(k => new Promise(res => { const im = new Image(); im.onload = res; im.onerror = res; im.src = icon(k, 112); wheelImgs[k] = im; })));
}

const CUSTOMERS = [['bunny', 'Bella'], ['pig', 'Percy'], ['duck', 'Daisy'], ['sheep', 'Shelby']];
function genOrder() {
  const goods = ['carrot', 'corn', 'turnip', 'pumpkin', 'sunflower'].slice(0, S.lvl < 4 ? 3 : 5).concat(Object.keys(CROPS).filter(k => CROPS[k].flvl && S.flvl >= CROPS[k].flvl));
  if (countB('sheeppen')) goods.push('wool');
  if (countB('pigpen')) goods.push('truffle');
  for (const b of ['bakery', 'juicer']) if (countB(b)) CRAFT[b].forEach(r => { if (Object.keys(r.need).every(k => goods.includes(k) || ['egg', 'honey', 'milk'].includes(k))) goods.push(r.out); });
  if (countB('coop')) goods.push('egg', 'egg');
  if (countB('hive')) goods.push('honey');
  if (countB('dairy')) goods.push('milk');
  const kinds = shuffleArr([...new Set(goods)]).slice(0, 1 + ri(S.lvl < 6 ? 2 : 3));
  const need = {}; let val = 0;
  for (const k of kinds) { const n = RES[k].good ? 1 + ri(2) : ['egg', 'honey', 'milk'].includes(k) ? 1 + ri(3) : 2 + ri(4); need[k] = n; val += RES[k].price * n; }
  const [who, name] = pick(CUSTOMERS);

}

function confetti(n, fromEl) {
  n = n || 140;
  const c = document.createElement('canvas'); c.className = 'confetti';
  const W = innerWidth, H = innerHeight, d = Math.min(2, devicePixelRatio || 1);
  c.width = W * d; c.height = H * d; document.body.appendChild(c);
  const x = c.getContext('2d'); x.scale(d, d);
  let ox = W / 2, oy = H * 0.35;
  if (fromEl) { const r = fromEl.getBoundingClientRect(); ox = r.left + r.width / 2; oy = r.top + r.height / 2; }
  const cols = FRUIT_COL.concat(['#fff', '#2ec4e6']);
  const P = Array.from({ length: n }, () => {
    const a = -Math.PI / 2 + (rnd() - 0.5) * 2.4, sp = (fromEl ? 250 : 420) + rnd() * 520;
    return { x: ox, y: oy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r: rnd() * TAU, vr: (rnd() - 0.5) * 14, w: 6 + rnd() * 6, h: 4 + rnd() * 6, col: pick(cols) };
  });
  let last = performance.now(), age = 0;
  const step = t => {
    const dt = Math.min(0.04, (t - last) / 1000); last = t; age += dt;
    x.clearRect(0, 0, W, H);
    for (const p of P) {
      p.vy += 900 * dt; p.vx *= 0.99; p.x += p.vx * dt; p.y += p.vy * dt; p.r += p.vr * dt;
      x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.globalAlpha = Math.max(0, 1 - age / 2.6);
      x.fillStyle = p.col; x.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * Math.abs(Math.cos(p.r * 2)) + 1); x.restore();
    }
    if (age < 2.6) requestAnimationFrame(step); else c.remove();
  };
  requestAnimationFrame(step);
}

function editTap(i) {

    if (!movable(i)) { if (S.farm.tiles[i]) toast('That one stays put. Tap it outside Move mode to clear it.'); return; }
    EDIT.sel = i; SFX.click();

let DRAG = null;
(function setupDrag() {
  const fg = $('#fgrid'); if (!fg) return;
  fg.addEventListener('pointerdown', e => {
    if (!EDIT.on) return;
    const t = e.target.closest('.tile'); if (!t) return;
    DRAG = { i: +t.dataset.i, x: e.clientX, y: e.clientY, moved: false, ghost: null, over: null };
    try { fg.setPointerCapture(e.pointerId); } catch (_) {}
  });
  fg.addEventListener('pointermove', e => {
    if (!DRAG) return;
    if (!DRAG.moved) {
      if (Math.hypot(e.clientX - DRAG.x, e.clientY - DRAG.y) < 12 || !movable(DRAG.i)) return;
      DRAG.moved = true;
      const x = S.farm.tiles[DRAG.i], g = document.createElement('img');
      g.src = icon(isF(x) ? (x.crop || 'field') : x.b === 'windmill' ? 'windmill' : x.b, 140); g.className = 'dragGhost';
      document.body.appendChild(g); DRAG.ghost = g;
      const src = $(`#fgrid .tile[data-i="${DRAG.i}"]`); if (src) src.classList.add('lifted');
      SFX.click();
    }
    DRAG.ghost.style.left = e.clientX + 'px'; DRAG.ghost.style.top = e.clientY + 'px';
    const under = document.elementFromPoint(e.clientX, e.clientY), t = under && under.closest('#fgrid .tile');
    if (DRAG.over && DRAG.over !== t) DRAG.over.classList.remove('dropT');
    DRAG.over = t; if (t) t.classList.add('dropT');
  });
  const end = e => {
    if (!DRAG) return;
    const d = DRAG; DRAG = null;
    if (d.ghost) d.ghost.remove();
    $$('#fgrid .lifted, #fgrid .dropT').forEach(x => x.classList.remove('lifted', 'dropT'));
    if (d.moved) { if (d.over) { EDIT.sel = null; $$('#fgrid .picked').forEach(x => x.classList.remove('picked')); doMove(d.i, +d.over.dataset.i); } }
    else if (e.type === 'pointerup') editTap(d.i);
  };
  fg.addEventListener('pointerup', end);
  fg.addEventListener('pointercancel', end);
})();

function weatherNow() {
  const blk = Math.floor(Date.now() / 1800000), h = ((blk * 2654435761) >>> 0) % 7;
  return { rain: h === 0 || h === 3, ends: (blk + 1) * 1800000 };
}
const isNight = () => { const h = new Date().getHours(); return h >= 20 || h < 6; };
const isEve = () => { const h = new Date().getHours(); return h >= 17 && h < 20; };
function rainTick() {
  if (!S.farm || !weatherNow().rain) return;

  S.farm.tiles.forEach((x, i) => {
    if (x && isF(x) && x.crop && !x.watered && !fieldReady(x)) { x.dur -= (x.t0 + x.dur - Date.now()) / 2; x.watered = true; n++; if (CUR === 'scrFarm') refreshTile(i); }

function rollSticker() {
  const pool = [];
  for (const s of STICKER_SETS) for (const k of s.items) pool.push([k, s.rare ? 1 : 4]);
  let t = rnd() * pool.reduce((a, p) => a + p[1], 0);
  for (const [k, w] of pool) { t -= w; if (t <= 0) return k; }
  return 'f0';
}
const stickerCount = () => Object.keys(S.stk).length;
const totalStickers = STICKER_SETS.reduce((a, s) => a + s.items.length, 0);

      <div class="sgrid">${s.items.map(k => `<div class="stkr ${S.stk[k] ? '' : 'miss'}">${img(k, '', 112)}${S.stk[k] > 1 ? `<span class="sx">x${S.stk[k]}</span>` : ''}</div>`).join('')}</div></div>`;

function openPack() {
  if (!S.packs) return;
  S.packs--;
  const pulls = [rollSticker(), rollSticker(), rollSticker()];
  let dupeCoins = 0;
  const cards = pulls.map((k, i) => {

  p.push({ key: 'spc', n: 4 + ri(5), label: n => `Make ${n} power-ups`, icon: 'bomb' });
  p.push({ key: 'cmb', n: 1 + ri(2), label: n => `Fire ${n} power-up combo${n > 1 ? 's' : ''}`, icon: 'rain' });
  p.push({ key: 'hrv', n: 5 + ri(6), label: n => `Harvest ${n} crops`, icon: 'carrot' });

function ensureQuests() {

  const pool = shuffleArr(questPool()), list = [], used = new Set();
  for (const q of pool) { const fam = q.key.split(':')[0]; if (used.has(fam)) continue; used.add(fam); list.push({ key: q.key, n: q.n, label: q.label(q.n), icon: q.icon, claimed: false }); if (list.length === 3) break; }
  S.dq = { date: today(), list, prog: {}, bonus: false };
}
function dqAdd(key, n) {
  if (!S.dq || S.dq.date !== today()) return;
  if (!S.dq.list.some(q => q.key === key)) return;
  S.dq.prog[key] = (S.dq.prog[key] || 0) + (n || 1);
  const q = S.dq.list.find(q => q.key === key);
  if (q && !q.claimed && S.dq.prog[key] >= q.n && !q.toasted) { q.toasted = true; if (CUR !== 'scrGame') toast(`Quest complete: ${q.label}!`); }
  refreshSide();
}
const QREW = { coins: 60, gems: 2, tokens: 5 };
const questReady = () => S.dq && (S.dq.list.some(q => !q.claimed && (S.dq.prog[q.key] || 0) >= q.n) || (!S.dq.bonus && S.dq.list.every(q => q.claimed)));

      ${S.dq.bonus ? '<span class="lockmsg">Claimed</span>' : `<button class="btn sm ${allDone ? '' : 'gray'}" data-qb>Claim</button>`}</div>`);

// ---------- CLOUD SAVE (private per signed-in viewer) ----------
const CLOUD = { ref: null, on: false, busy: false, dirty: false, t: 0, last: 0, sig: '', err: '', pending: null };
const U7_HAD_LOCAL = (() => { try { return !!localStorage.getItem(SAVE_KEY); } catch (e) { return false; } })();
const cloudSig = () => JSON.stringify(S, (k, v) => (k === 'savedAt' || k === 'last' ? undefined : v));
async function cloudInit() {
  try {
    if (!window.claude || typeof window.claude.use !== 'function') return;
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if (!db || !user || typeof user.id !== 'function') return;
    const uid = await user.id();
    if (!uid) return;
    CLOUD.ref = db.doc('data/users/' + uid + '/save');
    let snap;
    try { snap = await CLOUD.ref.get(); } catch (e) { if (e && e.code === 'unavailable') snap = await CLOUD.ref.get(); else throw e; }
    CLOUD.on = true;
    if (snap && snap.exists) {
      const d = snap.data();
      if (d && d.s && (!U7_HAD_LOCAL || (d.t || 0) > (S.savedAt || 0))) {
        const obj = JSON.parse(d.s);
        if (obj && obj.v === 1) {
          CLOUD.last = d.t;
          if (CUR === 'scrGame') CLOUD.pending = obj; else applyCloud(obj);
          CLOUD.sig = cloudSig();
          return;
        }
      }
    }
    cloudQueue(0);
  } catch (e) { CLOUD.err = (e && e.code) || 'error'; }
}
function applyCloud(obj) {
  const def = defaultSave();
  S = Object.assign(def, obj);
  S.seeds = Object.assign(defaultSave().seeds, obj.seeds); S.items = Object.assign(defaultSave().items, obj.items);
  ensureFarm(); ensureMeta(); ensureU4(); ensureU5(); ensureU7(); ensureU8(); ensureU9(); ensureU10(); ensureU11(); ensureU13(); tickOrders(); FV.fitted = false;
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {}
  SFX.applyVol(); updateTop(); buildSide();
  if (CUR === 'scrTitle') refreshTitle(); else if (CUR === 'scrMap') { $('#mapInner').dataset.sig = ''; show('scrMap'); } else if (CUR === 'scrFarm') show('scrFarm');
  toast('Cloud save loaded!');
}
function cloudQueue(ms) {
  if (!CLOUD.on || CLOUD.t) return;
  CLOUD.t = setTimeout(() => { CLOUD.t = 0; cloudPush(); }, ms == null ? 6000 : ms);
}
async function cloudPush() {
  if (!CLOUD.on || !CLOUD.ref) return;
  if (CLOUD.busy) { CLOUD.dirty = true; return; }
  if (CLOUD.pending) return;
  const sig = cloudSig();
  if (sig === CLOUD.sig) return;
  const body = JSON.stringify(S);
  if (body.length > 240000) { CLOUD.err = 'too big'; return; }
  CLOUD.busy = true; const t = S.savedAt;
  try { await CLOUD.ref.set({ t, v: 7, s: body }); CLOUD.last = t; CLOUD.sig = sig; CLOUD.err = ''; }
  catch (e) {
    CLOUD.err = (e && e.code) || 'error';
    if (CLOUD.err === 'not_granted' || CLOUD.err === 'not_writer') CLOUD.on = false;
  }
  CLOUD.busy = false;
  if (CLOUD.dirty) { CLOUD.dirty = false; cloudQueue(); }
}
function cloudLine() {
  if (CLOUD.on) return `<div class="cloud on">${img('star', '', 64)} Cloud save is on. Your progress follows you to any device where you're signed in.</div>`;
  return `<div class="cloud">Progress is saved on this device. Open the game from your Claude account to turn on cloud save.</div>`;
}

const RACE_GOAL = 12, RACE_LEN = 72 * 3600e3;

function raceNew() {

}
const raceOn = () => S.race && !S.race.claimed;
const raceOver = () => raceOn() && (S.race.fin || Date.now() - S.race.start >= RACE_LEN);
const rivalProg = (r, t) => Math.min(RACE_GOAL, Math.floor(RACE_GOAL * Math.pow(Math.max(0, (t - S.race.start) / r.T), 0.92)));
function raceRank() {
  const rc = S.race, t = rc.fin || Math.min(Date.now(), rc.start + RACE_LEN);
  if (rc.fin) return 1 + rc.rivals.filter(r => rc.start + r.T < rc.fin).length;
  return 1 + rc.rivals.filter(r => rivalProg(r, t) > rc.wins || rc.start + r.T <= t).length;
}
const RACE_PRIZE = [null, { gems: 25, coins: 400, pack: 2 }, { gems: 10, coins: 200, pack: 1 }, { coins: 120 }, { coins: 50 }, { coins: 30 }];
function raceWin() {
  if (!raceOn() || raceOver()) return null;

}

function expandDir(d) {

const b64 = { enc: bytes => { let s = ''; for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(s); }, dec: str => Uint8Array.from(atob(str), ch => ch.charCodeAt(0)) };
async function makeSaveCode() {
  const bytes = new TextEncoder().encode(JSON.stringify(S));
  if (window.CompressionStream) {
    try { const out = new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer()); return 'HP2:' + b64.enc(out); } catch (e) {}
  }
  return 'HP1:' + b64.enc(bytes);
}
async function readSaveCode(code) {
  code = (code || '').replace(/\s+/g, '');
  const tag = code.slice(0, 4), body = code.slice(4);
  let bytes = b64.dec(body);
  if (tag === 'HP2:') bytes = new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer());
  else if (tag !== 'HP1:') throw new Error('bad');
  const obj = JSON.parse(new TextDecoder().decode(bytes));
  if (!obj || obj.v !== 1 || !obj.farm) throw new Error('bad');
  return obj;

let PD = null;
function cellFromPt(x, y) {
  const c = Math.floor((x - L.x0) / L.cs), r = Math.floor((y - L.y0) / L.cs);
  const cell = at(r, c);
  return cell && !cell.hole ? cell : null;
}
cv.addEventListener('pointerdown', e => {
  if (!G || G.over) return;
  G.idle = 0; G.hint = null;
  const cell = cellFromPt(e.clientX, e.clientY);
  if (!cell) { G.sel = null; return; }
  PD = { cell, x: e.clientX, y: e.clientY, done: false };
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
});
cv.addEventListener('pointermove', e => {
  if (!PD || PD.done || !G || G.busy || G.shovel) return;
  const dx = e.clientX - PD.x, dy = e.clientY - PD.y;
  if (Math.hypot(dx, dy) < L.cs * 0.3) return;
  PD.done = true;
  const [dr, dc] = Math.abs(dx) > Math.abs(dy) ? [0, Math.sign(dx)] : [Math.sign(dy), 0];
  const t = at(PD.cell.r + dr, PD.cell.c + dc);
  G.sel = null;
  if (t && !t.hole) doSwap(PD.cell, t);
});
cv.addEventListener('pointerup', () => { if (!PD) return; const pd = PD; PD = null; if (!pd.done) tapCell(pd.cell); });

function tapCell(cell) {
  if (!G || G.busy || G.over) return;
  if (G.shovel) { useShovel(cell); return; }
  if (G.tractor) { useTractor(cell); return; }
  if (G.sel && G.sel !== cell && adjacent(G.sel, cell)) { const a = G.sel; G.sel = null; doSwap(a, cell); return; }
  if (live(cell) && cell.piece.k === 's' && !cell.ice) { tapSpecial(cell); return; }
  G.sel = swappable(cell) && G.sel !== cell ? cell : null;
  if (G.sel) SFX.click();
}

function startLevel(n, boosters) {

function rollSeed(n) {
  const w = n < 5 ? { carrot: 5, corn: 4, turnip: 2 } : Object.assign({ carrot: 30, corn: 25, turnip: 20, pumpkin: 15, sunflower: 10 }, n >= 15 ? { tomato: 16, potato: 14 } : {}, n >= 30 ? { mango: 9 } : {});
  let t = rnd() * Object.values(w).reduce((a, b) => a + b, 0);
  for (const [k, v] of Object.entries(w)) { t -= v; if (t <= 0) return k; }
  return 'carrot';
}
function win() {
  if (G.def.daily) return winDaily();
  const n = G.n, boss = !!G.boss;
  const pct = G.movesLeft / G.maxMoves;
  const stars = pct >= 0.3 ? 3 : pct >= 0.12 ? 2 : 1;
  const first = n >= S.lvl;
  S.stars[n] = Math.max(S.stars[n] || 0, stars);
  if (first) S.lvl = n + 1;
  const prevBest = (S.best && S.best[n]) || 0, newBest = G.score > prevBest; if (newBest) S.best[n] = G.score;
  const golden = !!G.def.golden, gchest = golden && first;
  const coins = Math.round((10 + stars * 5 + (boss ? 50 : 0)) * petCoinMul()) + (G.goldCoins || 0) + (gchest ? GOLD_CHEST.coins : 0);
  let seeds = [];
  if (boss) seeds = first ? [rollSeed(n), rollSeed(n), 'sunflower'] : [rollSeed(n)];
  else if (first || rnd() < 0.3) seeds = [rollSeed(n)];
  const shovels = boss && first ? 2 : 0;
  const rainbows = boss && first ? 1 : 0;
  const unl = first ? newUnlocks(n) : [];
  const gems = (first ? (boss ? 5 : stars === 3 ? 1 : 0) : 0) + (gchest ? GOLD_CHEST.gems : 0);
  const streakUp = S.streak < 3; S.streak = Math.min(3, S.streak + 1);
  stat('wins'); if (boss) stat('bosses'); addXP(boss ? 15 : 5); dqAdd('win');
  const packs = (boss && first ? 2 : (first && stars === 3) || rnd() < 0.25 ? 1 : 0) + (gchest ? GOLD_CHEST.pack : 0);
  const tokens = 4 + stars * 2 + (boss ? 10 : 0);
  S.packs = (S.packs || 0) + packs; festPts(tokens);
  const x8 = u8Win(n, boss, first, stars);
  S.gems += gems;
  S.coins += coins; seeds.forEach(k => S.seeds[k]++); S.items.shovel += shovels; S.items.rainbow += rainbows;
  saveGame();
  SFX.win(); vibrate(40);
  const rw = [`<div class="rw">${img('coin', '', 112)}<span class="stk">+${coins}</span></div>`]
    .concat(seeds.map(k => `<div class="rw">${img('pk_' + k, '', 112)}<span class="stk sm">${CROPS[k].name}</span></div>`))
    .concat(shovels ? [`<div class="rw">${img('shovel', '', 112)}<span class="stk">+${shovels}</span></div>`] : [])
    .concat(rainbows ? [`<div class="rw">${img('rain', '', 112)}<span class="stk">+1</span></div>`] : [])
    .concat(gems ? [`<div class="rw">${img('gem', '', 112)}<span class="stk">+${gems}</span></div>`] : [])
    .concat(packs ? [`<div class="rw">${img('pack', '', 112)}<span class="stk">+${packs}</span></div>`] : [])
    .concat([`<div class="rw">${img('token', '', 112)}<span class="stk">+${tokens}</span></div>`]).concat(x8.chips);
  const el = popup(`<div class="ribbon ${golden ? 'gold' : 'green'} stk">${boss ? 'Boss Defeated!' : golden ? 'Golden Harvest!' : 'Level ' + n + ' Clear!'}</div>
    ${gchest ? `<div class="introImg gchest">${img('gchest', '', 200)}</div>` : ''}
    <div class="starRow">${[1, 2, 3].map(s => `<img class="bigstar ${s <= stars ? 'got' : 'off'}" src="${icon('star', 200)}" style="animation-delay:${0.2 + s * 0.28}s">`).join('')}</div>
    <div class="score stk">Score ${G.score.toLocaleString()}${newBest && prevBest ? ' <span class="newbest">New Best!</span>' : ''}</div>${!newBest ? `<div class="sub small">Your best: ${prevBest.toLocaleString()}</div>` : ''}
    <div class="sub small">${boss || gchest ? 'Treasure chest!' : 'Rewards'}</div><div class="rewards">${rw.join('')}</div>
    ${unl.length ? `<div class="unlock">${img(unl[0], '', 140)}<div><b>New on your farm!</b><span>${unl.map(k => BLD[k].name).join(', ')} unlocked</span></div></div>` : seeds.length && featOn('farm') ? '<div class="sub small">Plant your seeds on the Farm!</div>' : ''}
    ${x8.html}${streakUp ? `<div class="sub small">Hot Streak ${S.streak}! Next level starts with ${STREAK_GIFTS.slice(0, S.streak).map(k => ITEMS[k].name).join(' + ')}</div>` : ''}
    <div class="btns"><button class="btn orange" data-m>Map</button><button class="btn big" data-n>Next</button></div>`);
  setTimeout(() => confetti(stars === 3 || boss || golden ? 200 : 110), 200);
  [1, 2, 3].forEach(s => { if (s <= stars) setTimeout(() => SFX.star(s), (200 + s * 280) * TIME_SCALE); });

  el.querySelector('[data-n]').onclick = () => { SFX.click(); G = null; closePop(); show('scrMap'); openPre(n + 1); };
}
function winDaily() {
  const first = !chalDone();
  const r = first ? { coins: 120, gems: 8, pack: 1, tokens: 15, items: { [pick(['rocket', 'bomb', 'rainbow', 'shovel'])]: 1 } } : { coins: 20, tokens: 3 };
  S.chal = { date: today(), done: true, best: Math.max(G.score, S.chal.date === today() ? S.chal.best : 0) };
  const chips = grant(r);

  const el = popup(`<div class="ribbon red stk">Challenge Complete!</div><div class="introImg">${img('challenge', '', 200)}</div>

function lose() {
  G.busy = true; G.over = true; SFX.lose();
  const left = G.goals.filter(g => (g.t === 'boss' ? G.boss.hp > 0 : g.have < g.need));
