*{box-sizing:border-box}
:root{--ink:#3a2216;--cream:#fff7e3;--font:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
html,body{margin:0;height:100%;overflow:hidden;background:#7ad06a;font-family:var(--font);color:var(--ink);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;overscroll-behavior:none;-webkit-touch-callout:none}
button{font-family:inherit;cursor:pointer;color:inherit;-webkit-tap-highlight-color:transparent;border:0;background:none;padding:0}
img{-webkit-user-drag:none;user-select:none;pointer-events:none}
#cv{position:fixed;left:0;top:0;z-index:1;touch-action:none;display:none}
#fxcv{position:fixed;left:0;top:0;z-index:45;pointer-events:none}
.scr{position:fixed;inset:0;display:none;z-index:2}
.scr.on{display:block}
.stk{color:#fff;text-shadow:0 2px 0 var(--ink),2px 0 0 var(--ink),-2px 0 0 var(--ink),0 -2px 0 var(--ink),1.5px 1.5px 0 var(--ink),-1.5px 1.5px 0 var(--ink),1.5px -1.5px 0 var(--ink),-1.5px -1.5px 0 var(--ink),0 4px 0 var(--ink)}
.stk2{text-shadow:0 3px 0 var(--ink),3px 0 0 var(--ink),-3px 0 0 var(--ink),0 -3px 0 var(--ink),2.2px 2.2px 0 var(--ink),-2.2px 2.2px 0 var(--ink),2.2px -2.2px 0 var(--ink),-2.2px -2.2px 0 var(--ink),0 8px 0 #fff,7px 0 0 #fff,-7px 0 0 #fff,0 -7px 0 #fff,5px 5px 0 #fff,-5px 5px 0 #fff,5px -5px 0 #fff,-5px -5px 0 #fff,0 13px 0 rgba(58,34,22,.35)}
.card{background:var(--cream);border:4px solid #fff;border-radius:24px;box-shadow:0 0 0 3px var(--ink),0 8px 0 3px rgba(58,34,22,.28)}
.btn{font-size:22px;border:4px solid #fff;border-radius:20px;padding:10px 22px;background:linear-gradient(#8ae866,#38a52a);color:#fff;box-shadow:0 0 0 3px var(--ink),0 6px 0 3px var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:transform .06s;text-shadow:0 2px 0 var(--ink),2px 0 0 var(--ink),-2px 0 0 var(--ink),0 -2px 0 var(--ink),1.5px 1.5px 0 var(--ink),-1.5px 1.5px 0 var(--ink),1.5px -1.5px 0 var(--ink),-1.5px -1.5px 0 var(--ink)}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 3px var(--ink),0 2px 0 3px var(--ink)}
.btn.orange{background:linear-gradient(#ffc961,#f57c00)}.btn.blue{background:linear-gradient(#8fc0ff,#2f6fd6)}.btn.red{background:linear-gradient(#ff8a96,#d8203d)}.btn.gray{background:linear-gradient(#d4d4d4,#9a9a9a)}.btn.purple{background:linear-gradient(#c8a0ff,#7a3ae8)}
.btn.big{font-size:28px;padding:12px 40px}.btn.sm{font-size:16px;padding:5px 11px;border-radius:14px;border-width:3px}
.btn img.bi{width:32px;height:32px;margin:-6px 0}.btn img.mini,img.mini{width:20px;height:20px;vertical-align:-4px}
.pillc{font-size:14px;background:rgba(58,34,22,.35);border-radius:10px;padding:2px 8px;text-shadow:none}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes breathe{0%,100%{scale:1}50%{scale:1.06}}
@keyframes popin{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes wob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-7px) rotate(4deg)}}
.bump{animation:bumpA .3s}@keyframes bumpA{40%{transform:scale(1.25)}}
#wipe{position:fixed;inset:0;z-index:44;pointer-events:none;background:#fff;opacity:0}
#wipe.go{animation:wipeA .35s ease-out}@keyframes wipeA{0%{opacity:.6}100%{opacity:0}}

/* title */
#scrTitle{background:radial-gradient(circle at 50% 30%,#fff8d8 0,#b8ec9a 50%,#6cc04a 100%);overflow:hidden}
#logo{position:absolute;top:calc(var(--sat) + 9%);left:0;right:0;text-align:center;z-index:3;line-height:.95}
#logo span{display:inline-block;animation:wob 2.4s ease-in-out infinite}
#logo .l1{font-size:min(16vw,84px)}#logo .l2{font-size:min(22vw,116px);margin-top:4px}
#logo .tsub{font-size:22px;margin-top:10px;letter-spacing:1px}
#titleArt{position:absolute;left:0;right:0;bottom:calc(var(--sab) + 26%);height:180px}
#titleArt img{position:absolute}
.tRosie{width:150px;left:50%;margin-left:-75px;bottom:0;animation:hop 1.8s ease-in-out infinite}
.tFox{width:100px;left:6%;bottom:6px;animation:hop 2.2s ease-in-out infinite .4s}
.tCrow{width:96px;right:6%;bottom:30px;animation:wob 2s ease-in-out infinite}
.tCrops{position:absolute;left:0;right:0;bottom:-58px;display:flex;justify-content:center;gap:4px}
.tCrops img,#titleArt .tCrops img{position:static;width:48px;animation:hop 1.4s ease-in-out infinite}
.tCrops img:nth-child(2n){animation-delay:.3s}
.playWrap{position:absolute;left:0;right:0;bottom:calc(var(--sab) + 9%);text-align:center;z-index:4}
#btnPlay{font-size:36px;padding:14px 60px;animation:breathe 1.6s ease-in-out infinite}

/* top bar */

const ART_SRC = "'use strict';\n// ================= UTIL =================\nconst $ = (s, r = document) => r.querySelector(s);\nconst $$ = (s, r = document) => [...r.querySelectorAll(s)];\nconst TAU = Math.PI * 2;\nconst rnd = Math.random;\nconst ri = n => Math.floor(rnd() * n);\nconst pick = a => a[ri(a.length)];\nconst clamp = (v, a, b) => (v < a ? a : v > b ? b : v);\nconst lerp = (a, b, t) => a + (b - a) * t;\nlet TIME_SCALE = 1, ANIM_SPEED = 1;\nconst wait = ms => new Promise(r => setTimeout(r, ms * TIME_SCALE));\nfunction mulberry32(a) {\n  return function () {\n    a |= 0; a = (a + 0x6d2b79f5) | 0;\n    let t = Math.imul(a ^ (a >>> 15), 1 | a);\n    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;\n    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;\n  };\n}\nfunction shuffleArr(a, R = rnd) {\n  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(R() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }\n  return a;\n}\nconst easeOutBack = t => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };\nconst easeOut = t => 1 - Math.pow(1 - t, 3);\nconst easeInOut = t => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);\nfunction fmtTime(sec) {\n  sec = Math.max(0, Math.ceil(sec));\n  const m = Math.floor(sec / 60), s = sec % 60;\n  if (m >= 60) return `${Math.floor(m / 60)}h ${m % 60}m`;\n  return `${m}:${String(s).padStart(2, '0')}`;\n}\nfunction vibrate(ms) { try { if (S.vib !== false && navigator.vibrate) navigator.vibrate(ms); } catch (e) {} }\n\n// ================= ART: every sprite is drawn in code, then turned into a sticker =================\nconst INK = '#3a2216';\nconst FRUIT_COL = ['#ff4d5e', '#ff9a1f', '#ffd92e', '#56c43a', '#4f7dff', '#a35cff'];\nconst FRUIT_NAME = ['Strawberry', 'Orange', 'Lemon', 'Broccoli', 'Blueberry', 'Eggplant'];\n\nfunction mk(w, h) {\n  const c = document.createElement('canvas');\n  c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h === undefined ? w : h));\n  return c;\n}\nfunction circ(c, x, y, r) { c.beginPath(); c.arc(x, y, r, 0, TAU); }\nfunction ell(c, x, y, rx, ry, rot) { c.beginPath(); c.ellipse(x, y, rx, ry, rot || 0, 0, TAU); }\nfunction rrect(c, x, y, w, h, r) {\n  r = Math.max(0, Math.min(r, w / 2, h / 2));\n  c.beginPath(); c.moveTo(x + r, y);\n  c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);\n  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();\n}\nfunction rg(c, x, y, r, a, b) {\n  if (!(r > 0)) r = 0.01;\n  const g = c.createRadialGradient(x - r * 0.35, y - r * 0.45, r * 0.08, x, y, r * 1.08);\n  g.addColorStop(0, a); g.addColorStop(1, b); return g;\n}\nfunction lg(c, x0, y0, x1, y1, stops) {\n  const g = c.createLinearGradient(x0, y0, x1, y1);\n  stops.forEach((s, i) => g.addColorStop(i / (stops.length - 1), s)); return g;\n}\nfunction fs(c, fill, lw) { c.fillStyle = fill; c.fill(); if (lw) { c.lineWidth = lw; c.strokeStyle = INK; c.stroke(); } }\nfunction shine(c, x, y, rx, ry, rot, a) {\n  c.save(); c.globalAlpha = a == null ? 0.55 : a; ell(c, x, y, rx, ry, rot == null ? -0.6 : rot);\n  c.fillStyle = '#fff'; c.fill(); c.restore();\n}\nfunction star(c, x, y, R, r, n, rot) {\n  n = n || 5; rot = rot == null ? -Math.PI / 2 : rot; c.beginPath();\n  for (let i = 0; i < n * 2; i++) { const a = rot + (i * Math.PI) / n, rr = i % 2 ? r : R; c.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }\n  c.closePath();\n}\n// outline a group of overlapping shapes as one blob\nfunction union(c, shapes, fill, lw) {\n  c.strokeStyle = INK; c.lineWidth = lw * 2;\n  for (const s of shapes) { s(); c.stroke(); }\n  c.fillStyle = fill; for (const s of shapes) { s(); c.fill(); }\n}\nfunction leaf(c, x, y, len, ang, lw, fill, w) {\n  fill = fill || '#5cc94a'; w = w || 0.42;\n  c.save(); c.translate(x, y); c.rotate(ang);\n  c.beginPath(); c.moveTo(0, 0);\n  c.quadraticCurveTo(len * 0.45, -len * w, len, 0); c.quadraticCurveTo(len * 0.45, len * w, 0, 0); c.closePath();\n  c.fillSt // ================= ENGINE: pure board logic (no drawing, no DOM) =================
// Runs the same in the game and in the node calibration bot.
// A move returns a list of "steps"; each step says what popped, what was made and where every piece ended up,
// so the renderer only has to animate from one snapshot to the next.
const ENG = (() => {
  const DIRS = [[0, 1], [1, 0], [0, -1], [-1, 0]];
  const POWERS = ['hoeH', 'hoeV', 'bee', 'bomb', 'sun'];
  const isHoe = p => p === 'hoeH' || p === 'hoeV';
  function RNG(seed) { this.s = seed >>> 0 || 1; }
  RNG.prototype.next = function () {
    let a = (this.s = (this.s + 0x6d2b79f5) | 0);
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  RNG.prototype.int = function (n) { return Math.floor(this.next() * n); };
  RNG.prototype.pick = function (a) { return a[this.int(a.length)]; };

  // ---------- boss data (engine side) ----------
  const BOSS = {
    grub: { attack: 'thorn', n: 3, every: 3, attack2: 'bram' },
    raccoon: { attack: 'steal', n: 1, every: 3, attack2: 'thorn' },
    mole: { attack: 'stone', n: 3, every: 3, attack2: 'mud' },
    goat: { attack: 'frost', n: 4, every: 3, attack2: 'stone' },
    crow: { attack: 'egg', n: 2, every: 3, attack2: 'frost' },
    chick: { attack: 'none', n: 0, every: 99, hop: true },
  };

  class Board {
    constructor(def, seed, opts) {
      opts = opts || {};
      this.def = def; this.sim = !!opts.sim; this.perks = opts.perks || {};
      this.rng = new RNG(seed == null ? (Math.random() * 1e9) | 0 : seed);
      this.rows = def.map.length; this.cols = def.map[0].length;
      this.colors = def.colors || 5;
      this.moves = def.moves; this.maxMoves = def.moves; this.used = 0;
      this.nextId = 1; this.score = 0; this.over = false; this.won = false;
      this.collected = {}; this.seedsTotal = def.seeds || 0; this.seedsSpawned = 0; this.seedsGot = 0;
      this.made = 0; this.combos = 0; this.cascadeMax = 0; this.mudCleared = false; this.lastAtk = -1; this.cleared = new Array(8).fill(0);
      this.cells = [];
      const fl = def.floor || [], cv = def.cover || [];
      for (let r = 0; r < this.rows; r++) for (let c = 0; c < this.cols; c++) {
        const ch = def.map[r][c], f = (fl[r] || '')[c] || '.', v = (cv[r] || '')[c] || '.';
        const cell = { r, c, hole: ch === 'x' || ch === ' ', bram: f === 'b' ? 1 : f === 'B' ? 2 : 0, mud: f === 'm' ? 1 : 0, frost: v === 'f' ? 1 : v === 'F' ? 2 : 0, cage: v === 'g' ? 1 : 0, p: null };
        if (!cell.hole) {
          if ('tTU'.includes(ch)) cell.p = this.mk('b', { b: 'thorn', hp: ' tTU'.indexOf(ch) });
          else if ('sS'.includes(ch)) cell.p = this.mk('b', { b: 'stone', hp: ch === 's' ? 1 : 2 });
          else if (ch === 'e') cell.p = this.mk('b', { b: 'egg', hp: 1, cnt: def.egg || 6, cnt0: def.egg || 6 });
          else if (ch === 'a') { cell.p = this.mk('s', {}); this.seedsSpawned++; }
        }
        this.cells.push(cell);
      }
      // boss
      this.boss = null;
      if (def.boss) {
        const bd = BOSS[def.boss.id] || BOSS.grub;
        let at = null;
        for (let r = 0; r < this.rows && !at; r++) for (let c = 0; c < this.cols; c++) if (def.map[r][c] === 'K') { at = [r, c]; break; }
        if (!at) at = [1, Math.floor(this.cols / 2) - 1];
        this.boss = Object.assign({ id: def.boss.id, hp: def.boss.hp, max: def.boss.hp, every: def.boss.every || bd.every, attack: def.boss.attack || bd.attack, attack2: def.boss.attack2 || bd.attack2, n: def.boss.n || bd.n, hop: bd.hop, rage: false, r: at[0], c: at[1] });
        this.placeBoss(at[0], at[1]);
      }
      this.goals = (def.goals || []).map(g => Object.assign({}, g));
      this.fill(true);
      for (const g of this.goals) g.start = this.remaining(g);
    }
    mk(k, o) { return Object.assign({ id: this.nextId++, k }, o); }
    at(r, c) { return r < 0 || c < 0 || r >= this.rows || c >= this.cols ? null : this.cells[r * this.cols + c]; }
    nb(cell) { const o = []; for (const [dr, dc] of DIRS) { const x = this.at(cell.r + dr, cell.c + dc); if (x && !x.hole) o.push(x); } return o; }
    locked(cell) { return cell.frost > 0 || cell.cage > 0; }
    movable(cell) { const p = cell.p; return !!p && (p.k === 'c' || p.k === 'p' || p.k === 's') && !this.locked(cell); }
    swappable(cell) { return !!cell && !cell.hole && this.movable(cell) && !cell.mud; }
    crop(col) { return this.mk('c', { c: col }); }
    randCol() { return this.rng.int(this.colors); }

    // ---------- goals ----------
    remaining(g) {
      let n = 0;
      switch (g.t) {
        case 'crop': return Math.max(0, g.n - (this.collected[g.c] || 0));
        case 'bram': for (const x of this.cells) n += x.bram; return n;
        case 'frost': for (const x of this.cells) n += x.frost; return n;
        case 'cage': for (const x of this.cells) n += x.cage; return n;
        case 'mud': for (const x of this.cells) n += x.mud; return n;
        case 'thorn': case 'stone': for (const x of this.cells) if (x.p && x.p.k === 'b' && x.p.b === g.t) n += x.p.hp; return n;
        case 'egg': for (const x of this.cells) if (x.p && x.p.k === 'b' && x.p.b === 'egg') n++; return n;
        case 'seed': return Math.max(0, this.seedsTotal - this.seedsGot);
        case 'boss': return this.boss ? Math.max(0, Math.ceil(this.boss.hp)) : 0;
      }
      return 0;
    }
    isWin() { return this.goals.every(g => this.remaining(g) <= 0); }
    goalOf(t, c) { return this.goals.find(g => g.t === t && (c == null || g.c === c)); }

    // ---------- filling ----------
    wouldMatch(cell, col) {
      const k = (r, c) => { const x = this.at(r, c); return x && x.p && x.p.k === 'c' ? x.p.c : -1; };
      const { r, c } = cell;
      if (k(r, c - 1) === col && k(r, c - 2) === col) return true;
      if (k(r - 1, c) === col && k(r - 2, c) === col) return true;
      if (k(r, c - 1) === col && k(r - 1, c) === col && k(r - 1, c - 1) === col) return true;
      return false;
    }
    fill(initial) {
      for (let attempt = 0; attempt < 60; attempt++) {
        const pre = initial && this.def.preset;
        for (const cell of this.cells) if (!cell.hole && (!cell.p || (attempt > 0 && cell.p.k === 'c' && cell.fresh))) {
          const pc = pre && attempt === 0 ? (pre[cell.r] || '')[cell.c] : null;
          if (pc && pc >= '0' && pc <= '7') { cell.p = this.crop(+pc); continue; }
          if (pc && 'HVBOU'.includes(pc)) { cell.p = this.mk('p', { pw: { H: 'hoeH', V: 'hoeV', B: 'bee', O: 'bomb', U: 'sun' }[pc] }); continue; }
          let col, t = 0;
          do { col = this.randCol(); t++; } while (t < 25 && this.wouldMatch(cell, col));
          cell.p = this.crop(col); cell.fresh = true;
        }
        if (!initial || this.hasMove()) break;
      }
      for (const cell of this.cells) delete cell.fresh;
    }
    placeBoss(r, c) {
      const b = this.boss; b.r = r; b.c = c; b.cells = [];
      for (const [dr, dc] of [[0, 0], [0, 1], [1, 0], [1, 1]]) {
        const x = this.at(r + dr, c + dc);
        x.p = { id: this.nextId++, k: 'boss' }; x.frost = 0; x.cage = 0; x.mud = 0; x.bram = 0;
        b.cells.push(x);
      }
    }

    // ---------- matching ----------
    findGroups() {
      const R = this.rows, C = this.cols, colOf = (r, c) => { const x = this.at(r, c); return x && !x.hole && x.p && x.p.k === 'c' && !this.locked(x) ? x.p.c : -1; };
      const sets = [];
      for (let r = 0; r < R; r++) for (let c = 0; c < C;) {
        const col = colOf(r, c); let e = c + 1;
        while (col >= 0 && colOf(r, e) === col) e++;
        if (col >= 0 && e - c >= 3) { const cells = []; for (let k = c; k < e; k++) cells.push(this.at(r, k)); sets.push({ cells, col, h: e - c, v: 0, sq: 0 }); }
        c = e;
      }
      for (let c = 0; c < C; c++) for (let r = 0; r < R;) {
        const col = colOf(r, c); let e = r + 1;
        while (col >= 0 && colOf(e, c) === col) e++;
        if (col >= 0 && e - r >= 3) { const cells = []; for (let k = r; k < e; k++) cells.push(this.at(k, c)); sets.push({ cells, col, h: 0, v: e - r, sq: 0 }); }
        r = e;
      }
      for (let r = 0; r < R - 1; r++) for (let c = 0; c < C - 1; c++) {
        const col = colOf(r, c);
        if (col >= 0 && colOf(r, c + 1) === col && colOf(r + 1, c) === col && colOf(r + 1, c + 1) === col) sets.push({ cells: [this.at(r, c), this.at(r, c + 1), this.at(r + 1, c), this.at(r + 1, c + 1)], col, h: 0, v: 0, sq: 1 });
      }
      // merge overlapping sets of the same color
      const groups = [];
      for (const s of sets) {
        const hit = groups.filter(g => g.col === s.col && s.cells.some(x => g.set.has(x)));
        let g;
        if (!hit.length) { g = { col: s.col, set: new Set(), h: 0, v: 0, sq: 0 }; groups.push(g); }
        else { g = hit[0]; for (const o of hit.slice(1)) { o.set.forEach(x => g.set.add(x)); g.h = Math.max(g.h, o.h); g.v = Math.max(g.v, o.v); g.sq |= o.sq; groups.splice(groups.indexOf(o), 1); } }
        s.cells.forEach(x => g.set.add(x)); g.h = Math.max(g.h, s.h); g.v = Math.max(g.v, s.v); g.sq |= s.sq;
      }
      for (const g of groups) {
        const run = Math.max(g.h, g.v);
        g.pw = run >= 5 ? 'sun' : g.h >= 3 && g.v >= 3 ? 'bomb' : run === 4 ? (g.h === 4 ? 'hoeH' : 'hoeV') : g.sq ? 'bee' : null;
        g.cells = [...g.set];
      }
      return groups;
    }
    hasMove() { return !!this.findHint(); }
    findHint() {
      for (const cell of this.cells) if (!cell.hole && cell.p && cell.p.k === 'p' && !this.locked(cell)) return [cell, cell];
      for (const a of this.cells) {
        if (!this.swappable(a)) continue;
        for (const [dr, dc] of [[0, 1], [1, 0]]) {
          const b = this.at(a.r + dr, a.c + dc);
          if (!this.swappable(b)) continue;
          if (a.p.k === 'p' || b.p.k === 'p') return [a, b];
          [a.p, b.p] = [b.p, a.p];
          const ok = this.lineAt(a) || this.lineAt(b);
          [a.p, b.p] = [b.p, a.p];
          if (ok) return [a, b];
        }
      }
      return null;
    }
    lineAt(cell) {
      const p = cell.p; if (!p || p.k !== 'c') return false;
      const k = (r, c) => { const x = this.at(r, c); return x && x.p && x.p.k === 'c' && x.p.c === p.c && !this.locked(x); };
      const { r, c } = cell;
      let h = 1; for (let i = 1; k(r, c - i); i++) h++; for (let i = 1; k(r, c + i); i++) h++;
      let v = 1; for (let i = 1; k(r - i, c); i++) v++; for (let i = 1; k(r + i, c); i++) v++;
      if (h >= 3 || v >= 3) return true;
      for (const [dr, dc] of [[-1, -1], [-1, 1], [1, -1], [1, 1]]) if (k(r + dr, c) && k(r, c + dc) && k(r + dr, c + dc)) return true;
      return false;
    }

    // ---------- step recording ----------
    snap() {
      if (this.sim) return null;
      return this.cells.map(x => ({ p: x.p ? Object.assign({}, x.p) : null, bram: x.bram, mud: x.mud, frost: x.frost, cage: x.cage }));
    }
    newStep() { this.st = { fx: [], gone: [], made: [], hits: [] }; return this.st; }
    pushStep(steps) {
      const st = this.st; st.mid = this.snap();
      this.gravity();
      st.end = this.snap(); st.boss = this.boss ? { hp: this.boss.hp, r: this.boss.r, c: this.boss.c, rage: this.boss.rage } : null;
      st.moves = this.moves; st.score = this.score; st.rem = this.sim ? null : this.goals.map(g => this.remaining(g));
      steps.push(st);
    }

    // ---------- hits ----------
    floorHit(cell) {
      if (cell.bram > 0) { cell.bram--; this.rec('hit', cell, 'bram'); return true; }
      if (cell.mud) { cell.mud = 0; this.mudCleared = true; this.rec('hit', cell, 'mud'); return true; }
      return false;
    }
    rec(t, cell, what) { if (this.st && !this.sim) this.st.hits.push({ t, r: cell.r, c: cell.c, what }); }
    gone(cell, how) {
      const p = cell.p; cell.p = null;
      if (p && this.st && !this.sim) this.st.gone.push({ id: p.id, r: cell.r, c: cell.c, k: p.k, col: p.c, pw: p.pw, b: p.b, how });
      return p;
    }
    cropGone(cell, how) {
      const p = this.gone(cell, how);
      this.collected[p.c] = (this.collected[p.c] || 0) + 1; this.cleared[p.c]++;
      this.score += 10 * Math.max(1, this.cascade || 1);
      if (this.boss && this.boss.hp > 0) this.dmgBoss(1);
    }
    dmgBoss(n) {
      const b = this.boss; if (!b || b.hp <= 0) return;
      b.hp = Math.max(0, b.hp - n);
      if (!b.rage && b.hp <= b.max / 2 && b.hp > 0) { b.rage = true; if (this.st) this.st.fx.push({ t: 'rage' }); }
      if (b.hp <= 0 && this.st) this.st.fx.push({ t: 'bossDown' });
    }
    hitBlocker(cell) {
      const p = cell.p; p.hp--;
      this.rec('hit', cell, p.b);
      if (p.hp <= 0) { this.gone(cell, 'break'); this.score += 40; if (this.boss) this.dmgBoss(3); }
    }
    hit(cell, kind) {
      if (!cell || cell.hole) return;
      const p = cell.p;
      if (kind === 'adj') {
        // ice and cages crack from matches next to them
        if (cell.frost > 0) { cell.frost--; this.rec('hit', cell, 'frost'); return; }
        if (cell.cage) { cell.cage = 0; this.rec('hit', cell, 'cage'); return; }
        // boulders need a blast to crack; once cracked, a match next to them finishes the job
        if (p && p.k === 'b' && (p.b !== 'stone' || p.hp <= 1)) this.hitBlocker(cell);
        else if (p && p.k === 'boss') { if (!this.bossAdj.has(cell)) { this.bossAdj.add(cell); this.dmgBoss(4); this.rec('hit', cell, 'boss'); } }
        if (cell.mud && (!p || p.k !== 'boss')) { cell.mud = 0; this.mudCleared = true; this.rec('hit', cell, 'mud'); }
        return;
      }
      if (p && p.k === 'boss') { this.dmgBoss(6); this.rec('hit', cell, 'boss'); return; }
      if (cell.frost > 0) { cell.frost--; this.rec('hit', cell, 'frost'); return; }
      if (cell.cage) { cell.cage = 0; this.rec('hit', cell, 'cage'); return; }
      if (p) {
        if (p.k === 'c') { this.cropGone(cell, kind); this.floorHit(cell); return; }
        if (p.k === 'p') { if (kind === 'blast' && !p.safe) { this.queue.push({ cell, p }); this.gone(cell, 'fire'); this.floorHit(cell); } return; }
        if (p.k === 'b') { if (kind === 'blast') this.hitBlocker(cell); return; }
        if (p.k === 's') return;
      } else if (kind === 'blast') this.floorHit(cell);
    }
    blast(list) { for (const x of list) if (x) this.hit(x, 'blast'); }

    // ---------- power effects ----------
    rowCells(r) { const o = []; for (let c = 0; c < this.cols; c++) { const x = this.at(r, c); if (x && !x.hole) o.push(x); } return o; }
    colCells(c) { const o = []; for (let r = 0; r < this.rows; r++) { const x = this.at(r, c); if (x && !x.hole) o.push(x); } return o; }
    area(r, c, rad, withCenter) { const o = []; for (let dr = -rad; dr <= rad; dr++) for (let dc = -rad; dc <= rad; dc++) { if (!withCenter && !dr && !dc) continue; const x = this.at(r + dr, c + dc); if (x && !x.hole) o.push(x); } return o; }
    beeTarget(taken) {
      const ok = x => !x.hole && !taken.has(x);
      const need = t => { const g = this.goalOf(t); return g && this.remaining(g) > 0; };
      if (this.boss && this.boss.hp > 0 && need('boss')) { const x = this.boss.cells.find(ok) || this.boss.cells[0]; return x; }
      const sc = x => {
        let s = 0; const p = x.p;
        if (p && p.k === 'b') s += need(p.b) ? 10 : 2;
        if (x.frost) s += need('frost') ? 8 : 1;
        if (x.cage) s += need('cage') ? 8 : 1;
        if (x.bram) s += need('bram') ? 6 + x.bram : 0;
        if (x.mud) s += need('mud') ? 7 : 0;
        if (p && p.k === 'c') { const g = this.goalOf('crop', p.c); if (g && this.remaining(g) > 0) s += 3; }
        if (p && p.k === 'p') s -= 5;
        // clearing the tile under a seed packet helps it fall
        if (need('seed')) { const up = this.above(x); if (up && up.p && up.p.k === 's') s += 6; }
        return s + this.rng.next() * 0.5;
      };
      let best = null, bs = -1e9;
      for (const x of this.cells) if (ok(x) && x.p && x.p.k !== 'boss' && x.p.k !== 's') { const s = sc(x); if (s > bs) { bs = s; best = x; } }
      return best;
    }
    fire(cell, p, carry) {
      const { r, c } = cell, fx = this.st ? this.st.fx : [];
      const pw = p.pw;
      this.score += 50;
      if (isHoe(pw)) {
        fx.push({ t: 'line', r, c, dir: pw === 'hoeH' ? 'h' : 'v' });
        this.blast(pw === 'hoeH' ? this.rowCells(r) : this.colCells(c));
      } else if (pw === 'bomb') {
        if (p.primed) { fx.push({ t: 'boom', r, c, rad: 1 }); this.blast(this.area(r, c, 1, true)); }
        else {
          fx.push({ t: 'boom', r, c, rad: 1 });
          // seed bomb: bursts now, sprouts back and bursts again when the board settles
          const np = this.mk('p', { pw: 'bomb', primed: true });
          if (!cell.p) cell.p = np; else this.primedLater.push(np);
          this.blast(this.area(r, c, 1, false));
        }
      } else if (pw === 'bee') {
        this.blast(this.nb(cell));
        const n = 1 + (this.perks.bee2 ? 1 : 0);
        for (let i = 0; i < n; i++) this.beeFly(cell, carry);
      } else if (pw === 'sun') {
        const col = carry != null ? carry : this.commonColor();
        const list = this.cells.filter(x => x.p && x.p.k === 'c' && x.p.c === col);
        fx.push({ t: 'sun', r, c, col, cells: list.map(x => [x.r, x.c]) });
        this.blast(list);
      }
    }
    beeFly(from, carry) {
      const t = this.beeTarget(this.beeTaken);
      if (!t) return;
      this.beeTaken.add(t);
      if (this.st) this.st.fx.push({ t: 'bee', r0: from.r, c0: from.c, r: t.r, c: t.c, carry: carry || null });
      if (carry && carry !== 'bee') { this.hit(t, 'blast'); this.fire(t, { pw: carry === 'hoe' ? (this.rng.next() < 0.5 ? 'hoeH' : 'hoeV') : carry }); }
      else this.hit(t, 'blast');
    }
    commonColor() {
      const n = new Array(8).fill(0);
      for (const x of this.cells) if (x.p && x.p.k === 'c') n[x.p.c]++;
      let best = 0; for (let i = 1; i < 8; i++) if (n[i] > n[best]) best = i;
      return best;
    }
    combo(a, b) {
      // b is where the combo lands
      const t = [a.p.pw, b.p.pw], has = x => t.includes(x), { r, c } = b, fx = this.st ? this.st.fx : [];
      const pa = this.gone(a, 'combo'), pb = this.gone(b, 'combo');
      this.combos++; this.score += 300;
      fx.push({ t: 'combo', r, c, kinds: t });
      if (has('sun')) {
        const o = t[0] === 'sun' ? t[1] : t[0];
        if (o === 'sun') { fx.push({ t: 'mega', r, c }); this.blast(this.cells.filter(x => !x.hole)); return; }
        // every crop of the most common kind turns into the other power and goes off
        const col = this.commonColor(), list = this.cells.filter(x => x.p && x.p.k === 'c' && x.p.c === col && !this.locked(x));
        fx.push({ t: 'sun', r, c, col, cells: list.map(x => [x.r, x.c]) });
        for (const x of list) {
          const pw = isHoe(o) ? (this.rng.next() < 0.5 ? 'hoeH' : 'hoeV') : o;
          this.gone(x, 'morph'); this.fire(x, { pw });
        }
        return;
      }
      if (has('bee')) {
        const o = t[0] === 'bee' ? t[1] : t[0];
        if (o === 'bee') { for (let i = 0; i < 3; i++) this.beeFly(b, null); return; }
        this.beeFly(b, isHoe(o) ? 'hoe' : o); return;
      }
      if (isHoe(t[0]) && isHoe(t[1])) { fx.push({ t: 'line', r, c, dir: 'h' }, { t: 'line', r, c, dir: 'v' }); this.blast(this.rowCells(r).concat(this.colCells(c))); return; }

const R0 = 9, C0 = 8;
const mid = c => Math.abs(c - (C0 - 1) / 2);
// where obstacles go
const PAT = {
  all: () => true,
  bottom1: r => r === R0 - 1, bottom2: r => r >= R0 - 2, bottom3: r => r >= R0 - 3,
  band: r => r === 4 || r === 5, band1: r => r === 4, wall: (r, c) => r === 5 && c !== 3 && c !== 4,
  upper: r => r >= 1 && r <= 3, lower_half: r => r >= 5,
  frame: (r, c) => r === 1 || r === R0 - 1 || ((c === 0 || c === C0 - 1) && r >= 1),
  center: (r, c) => r >= 3 && r <= 5 && c >= 2 && c <= 5, core: (r, c) => r >= 3 && r <= 6 && c >= 2 && c <= 5,
  diamond: (r, c) => Math.abs(r - 4.5) + mid(c) <= 3.5 && r >= 1,
  cols: (r, c) => (c === 1 || c === C0 - 2) && r >= 2, cols2: (r, c) => (c === 2 || c === C0 - 3) && r >= 2,
  sides: (r, c) => (c <= 1 || c >= C0 - 2) && r >= 2,
  checker: (r, c) => (r + c) % 2 === 0 && r >= 2 && r <= R0 - 2,
  sparse: (r, c) => (r + c * 2) % 4 === 0 && r >= 2 && r <= R0 - 2,
  corners: (r, c) => (r <= 3 || r >= R0 - 3) && (c <= 1 || c >= C0 - 2) && r >= 1,
  cross: (r, c) => ((c === 3 || c === 4) && r >= 1) || r === 4,
  X: (r, c) => r >= 1 && (Math.abs(c - (r - 1)) < 0.5 || Math.abs(c - (C0 - r)) < 0.5),
  stripes: r => r === 2 || r === 4 || r === 6,
  pockets: (r, c) => (r === 3 || r === 6) && (c === 1 || c === 2 || c === 5 || c === 6),
  ring: (r, c) => { const d = Math.max(Math.abs(r - 4.5), mid(c)); return d >= 2 && d <= 2.6 && r >= 1; },
};

const VILLAGER_FOR_AREA = ['Mabel', 'Pip', 'Daisy', 'Juniper', 'Fennel'];

function buildLevel(n) {
  const s = LV_SPEC[n - 1]; if (!s) return null;
  const R = mulberry32(n * 7919 + 3);
  const map = [], floor = [], cover = [];
  for (let r = 0; r < R0; r++) { map.push([]); floor.push([]); cover.push([]); for (let c = 0; c < C0; c++) { map[r].push((SHAPE[s.sh || 'full'])(r, c) ? 'x' : '.'); floor[r].push('.'); cover[r].push('.'); } }
  for (const o of s.o || []) {
    const [type, pat] = o.split(':'), [layer, ch] = OBS[type], f = PAT[pat];
    for (let r = 0; r < R0; r++) for (let c = 0; c < C0; c++) {
      if (map[r][c] === 'x' || !f(r, c)) continue;
      if (layer === 'floor') { if (floor[r][c] === '.') floor[r][c] = ch; }
      else if (layer === 'cover') { if (map[r][c] === '.' && cover[r][c] === '.' && floor[r][c] !== 'm') cover[r][c] = ch; }
      else if (r > 0 && map[r][c] === '.' && cover[r][c] === '.') map[r][c] = ch;
    }
  }
  // the tuner can thin out obstacles on levels that came out too long
  const tune0 = typeof LEVEL_TUNE !== 'undefined' ? LEVEL_TUNE[n] : null;
  if (tune0 && tune0.thin) {
    const T = mulberry32(n * 4409 + 1);
    for (let r = 0; r < R0; r++) for (let c = 0; c < C0; c++) if (T() < tune0.thin) {
      if ('tTUsSe'.includes(map[r][c])) map[r][c] = '.';
      if ('bBm'.includes(floor[r][c])) floor[r][c] = floor[r][c] === 'B' ? 'b' : '.';
      if ('fFg'.includes(cover[r][c])) cover[r][c] = cover[r][c] === 'F' ? 'f' : '.';
    }
  }
  // keep blast-only boulders and crow eggs to a fair number
  const cells = []; for (let r = R0 - 1; r >= 0; r--) for (let c = 0; c < C0; c++) cells.push([r, c]);
  let stoneHp = 0; for (const [r, c] of cells) stoneHp += map[r][c] === 'S' ? 2 : map[r][c] === 's' ? 1 : 0;
  for (const [r, c] of cells) { if (stoneHp <= 12) break; if (map[r][c] === 'S') { map[r][c] = 's'; stoneHp--; } }
  for (const [r, c] of cells) { if (stoneHp <= 12) break; if (map[r][c] === 's') { map[r][c] = '.'; stoneHp--; } }
  let eggs = 0; for (const [r, c] of cells) if (map[r][c] === 'e') { eggs++; if (eggs > 8) map[r][c] = '.'; }
  // the top tile of every column stays free so new crops can fall in
  for (let c = 0; c < C0; c++) { const r = map.findIndex(row => row[c] !== 'x'); if (r >= 0 && map[r][c] !== '.') map[r][c] = '.'; }
  // boss lair: a 2x2 clear spot near the top middle
  if (s.boss) { for (const [r, c] of [[1, 3], [1, 4], [2, 3], [2, 4]]) { map[r][c] = '.'; floor[r][c] = '.'; cover[r][c] = '.'; } map[1][3] = 'K'; }
  const goals = [], seen = new Set();
  const add = t => { if (!seen.has(t)) { seen.add(t); goals.push({ t }); } };
  for (let r = 0; r < R0; r++) for (let c = 0; c < C0; c++) for (const ch of [map[r][c], floor[r][c], cover[r][c]]) if (GOAL_OF[ch]) add(GOAL_OF[ch]);
  if (s.boss) { goals.length = 0; goals.push({ t: 'boss' }); }
  const tune = typeof LEVEL_TUNE !== 'undefined' ? LEVEL_TUNE[n] : null;
  const crops = (s.crop || []).map(x => x.slice());
  if (tune && tune.crop) for (const [c, k] of tune.crop) { const e = crops.find(x => x[0] === c); if (e) e[1] = k; else crops.push([c, k]); }
  for (const [c, k] of crops) goals.push({ t: 'crop', c, n: k });
  if (s.seeds) goals.push({ t: 'seed' });
  const area = areaOf(n), place = s.boss ? 'the ' + area.name.replace(/^The /, '') : /^the /i.test(s.name) ? 'the ' + s.name.slice(4) : /'s /.test(s.name) ? s.name : 'the ' + s.name;
  const key = s.boss ? 'boss' : s.seeds ? 'seed' : (s.o && s.o.length ? GOAL_OF[OBS[s.o[0].split(':')[0]][1]] : 'crop');
  const tmpl = WHY[key][Math.floor(R() * WHY[key].length)];
  const why0 = typeof LEVEL_WHY !== 'undefined' && LEVEL_WHY[n - 1];
  const why = why0 || tmpl.replace('{p}', place).replace('{b}', s.boss ? BOSS_NAME[s.boss.id] : '').replace('{c}', s.crop ? CROPS[s.crop[0][0]].pl : 'crops').replace('{v}', VILLAGER_FOR_AREA[AREAS.indexOf(area)]);
  const moves = (typeof LEVEL_MOVES !== 'undefined' && LEVEL_MOVES[n]) || s.moves || 25;

    n, name: s.name, why, area: area.id, h: s.h || 0, tut: s.tut || null,
    map: map.map(r => r.join('')), floor: floor.map(r => r.join('')), cover: cover.map(r => r.join('')),
    colors: n >= 50 ? Math.max(6, s.c || 5) : s.c || 5, moves, goals, seeds: Math.min(3, s.seeds || 0), egg: 6, preset: s.pre || null,
    boss: s.boss ? Object.assign({}, s.boss, { hp: (tune && tune.hp) || s.boss.hp }) : null,
  };
}

  if (d && d.v === 2) S = mergeSave(d);

    } catch (e) {}

function mergeSave(d) {
  const def = defaultSave(), s = Object.assign(def, d);
  for (const k of ['items', 'stats', 'fennel', 'daily', 'raid']) s[k] = Object.assign(defaultSave()[k], d[k] || {});
  for (const k of ['produce', 'seeds']) { s[k] = defaultSave()[k].map((v, i) => (d[k] && d[k][i] != null ? d[k][i] : v)); }
  if (!Array.isArray(s.garden)) s.garden = [null, null, null, null];
  while (s.garden.length < 4) s.garden.push(null);

}

  SAVE_PENDING = false;
  try {
    const j = JSON.stringify(S); localStorage.setItem(SAVE_KEY, j);
    if (Date.now() - (writeSave.bak || 0) > 30000) { writeSave.bak = Date.now(); localStorage.setItem(SAVE_KEY + '.bak', j); }
  } catch (e) {}
}

// ---------- cloud save (when opened from a Claude account) ----------
const CLOUD = { ref: null, on: false, busy: false, dirty: false, t: 0, sig: '', pending: null };
const HAD_LOCAL = (() => { try { return !!localStorage.getItem(SAVE_KEY); } catch (e) { return false; } })();
const cloudSig = () => JSON.stringify(S, (k, v) => (k === 'savedAt' || k === 'lastSeen' ? undefined : v));
async function cloudInit() {
  try {
    if (!window.claude || typeof window.claude.use !== 'function') return;
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if (!db || !user || typeof user.id !== 'function') return;
    const uid = await user.id(); if (!uid) return;
    CLOUD.ref = db.doc('data/users/' + uid + '/save2');
    let snap; try { snap = await CLOUD.ref.get(); } catch (e) { snap = await CLOUD.ref.get(); }
    CLOUD.on = true;
    if (snap && snap.exists) {
      const d = snap.data();
      if (d && d.s && (!HAD_LOCAL || (d.t || 0) > (S.savedAt || 0))) {
        const obj = JSON.parse(d.s);
        if (obj && obj.v === 2) { if (CUR === 'scrGame') CLOUD.pending = obj; else applyCloud(obj); CLOUD.sig = cloudSig(); return; }
      }
    }
    cloudQueue(0);
  } catch (e) {}
}
function applyCloud(obj) {
  S = mergeSave(obj);
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {}
  SFX.applyVol(); updateTop();
  if (CUR === 'scrValley') showValley(); else if (CUR === 'scrTitle') refreshTitle();
  toast('Cloud save loaded!');
}
function cloudQueue(ms) {
  if (!CLOUD.on || CLOUD.t) return;
  CLOUD.t = setTimeout(() => { CLOUD.t = 0; cloudPush(); }, ms == null ? 6000 : ms);
}
async function cloudPush() {
  if (!CLOUD.on || !CLOUD.ref || CLOUD.pending) return;
  if (CLOUD.busy) { CLOUD.dirty = true; return; }
  const sig = cloudSig(); if (sig === CLOUD.sig) return;
  const body = JSON.stringify(S); if (body.length > 240000) return;
  CLOUD.busy = true;
  try { await CLOUD.ref.set({ t: S.savedAt, v: 2, s: body }); CLOUD.sig = sig; }
  catch (e) { if (e && (e.code === 'not_granted' || e.code === 'not_writer')) CLOUD.on = false; }
  CLOUD.busy = false;
  if (CLOUD.dirty) { CLOUD.dirty = false; cloudQueue(); }
}

function teachHint(B) {
  let best = null, bs = -1;
  for (const a of B.cells) {
    if (a.hole || !a.p) continue;
    const opts = a.p.k === 'p' ? [[0, 0], [0, 1], [1, 0]] : [[0, 1], [1, 0]];
    for (const [dr, dc] of opts) {
      const b = dr || dc ? B.at(a.r + dr, a.c + dc) : a; if (!b || b.hole) continue;
      const x = B.clone(), r = x.act(x.at(a.r, a.c), x.at(b.r, b.c)); if (!r.ok) continue;
      const s = (x.combos - B.combos) * 10 + (x.made - B.made) * 5 + (a.p.k === 'p' && b !== a && b.p && b.p.k === 'p' ? 20 : 0) + Math.random() * 0.1;
      if (s > bs) { bs = s; best = [a, b]; }
    }
  }
  return best || B.findHint();
}

      const [r1, c1, r2, c2] = st.swap;

}

function makeRequest(id) {

  const tot = Object.values(need).reduce((x, y) => x + y, 0);
  const r = Math.random(), extra = r < 0.14 ? { star: 1 } : r < 0.4 ? { seed: kinds[0] } : r < 0.55 ? { item: pick(['hoe', 'bomb', 'shovel', 'glove']) } : r < 0.65 ? { gems: 3 } : {};
  return { need, coins: 40 + tot * 4, pts: tot > 24 ? 2 : 1, extra };
}

function awayCheck() {
  const away = Date.now() - (S.lastSeen || Date.now());
  S.lastSeen = Date.now(); saveGame();
  if (away < 2 * 3600000 || S.lvl < 6) return;
  const items = [];
  const ready = S.garden.filter(g => g && gardenProg(g) >= 1);
  if (ready.length) items.push(['plot3_' + ready[0].c, `Your garden is ready: ${ready.map(g => CROPS[g.c].pl).join(', ')}!`]);
  for (const id of Object.keys(VILLAGERS)) if (villagerOn(id) && reqReady(id)) items.push([CAST2[id].icon, `${CAST2[id].name} has a new request.`]);
  if (S.unl.fennel) { fennelStock(); items.push(['fox', 'Fennel restocked his stall with fresh deals.']); }
  const R = Math.random();
  if (!areaDone(4) && R < 0.35 && S.produce.some(v => v >= 20)) {
    const c = S.produce.indexOf(Math.max(...S.produce)), n = Math.max(5, Math.round(S.produce[c] * 0.15));
    S.produce[c] -= n; S.chase = { c, n, until: Date.now() + 20 * 3600000 };
    items.push(['crow', `Baron Crow raided your barn and grabbed ${n} ${CROPS[c].pl}! Catch him on the farm to get them back.`]);
  } else if (R < 0.7) { const n = 40 + Math.floor(Math.random() * 80); S.coins += n; items.push(['coin', `A traveler left you ${n} coins as thanks for the lovely valley.`]); }
  else { const k = Math.floor(Math.random() * 5); S.seeds[k] += 2; items.push(['seedpk', `Pip found 2 ${CROPS[k].name.toLowerCase()} seed packets while exploring.`]); }
  const wx = weather(); items.push([wx.icon, `Today's weather: ${wx.name}. ${wx.text}`]);
  saveGame(); updateTop();
  S.inbox = items;
}

function domFly(key, x0, y0, x1, y1, size, dur, delay) {
  return new Promise(res => setTimeout(() => {
    const im = document.createElement('img'); im.src = icon(key, 96); im.className = 'coinfly'; im.style.width = im.style.height = size + 'px';
    document.body.appendChild(im);
    const cxp = (x0 + x1) / 2 + (Math.random() - 0.5) * 120, cyp = Math.min(y0, y1) - 40 - Math.random() * 60, kf = [];
    for (let i = 0; i <= 12; i++) { const t = i / 12, u = 1 - t, x = u * u * x0 + 2 * u * t * cxp + t * t * x1, y = u * u * y0 + 2 * u * t * cyp + t * t * y1; kf.push({ transform: `translate(${x - size / 2}px,${y - size / 2}px) scale(${(1 + Math.sin(t * Math.PI) * 0.5).toFixed(3)}) rotate(${(t * 200).toFixed(0)}deg)` }); }
    let done = false; const fin = () => { if (done) return; done = true; im.remove(); res(); };
    try { im.animate(kf, { duration: dur * TIME_SCALE, easing: 'cubic-bezier(.4,0,.6,1)' }).onfinish = fin; } catch (e) { fin(); }
    setTimeout(fin, (dur + 300) * TIME_SCALE);
  }, delay * TIME_SCALE));
}
function centerOf(el) { const r = el.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; }

// ---------- the restore moment ----------
async function restoreMoment(t, apply) {
  const box = $('#valleyScene'), id = Object.keys(t.set || {})[0];
  S.view = AREA_IDS.indexOf(t.area); renderValley();
  const el = id && box.querySelector(`[data-id="${id}"]`);
  const target = el ? centerOf(el.querySelector('img') || el) : [window.innerWidth / 2, window.innerHeight * 0.45];
  // lean in toward the spot
  const br = box.getBoundingClientRect(), ox = target[0] - br.left, oy = target[1] - br.top;
  box.classList.add('zoomTo'); box.style.transformOrigin = `${ox}px ${oy}px`; box.style.transform = 'translateX(-50%) scale(1.16)';
  box.querySelectorAll('.tmark').forEach(e => e.remove());
  await wait(450);
  const tgt = el ? centerOf(el.querySelector('img') || el) : target;
  // the stars fly from the bank into the building
  const from = centerOf($('#iStar')), n = Math.min(8, Math.max(3, t.cost));
  const flights = [];
  for (let i = 0; i < n; i++) flights.push(domFly('star', from[0], from[1], tgt[0] + (Math.random() - 0.5) * 30, tgt[1] + (Math.random() - 0.5) * 20, 34, 620, i * 90).then(() => { SFX.collect(i); overlaySparkle(tgt[0], tgt[1], 3); }));
  let shown = S.starBank + t.cost; // already spent: count down as they leave
  for (let i = 0; i < n; i++) setTimeout(() => { shown = Math.max(S.starBank, shown - Math.ceil(t.cost / n)); $('#tStars').textContent = shown; bump('#pStars'); }, i * 90 * TIME_SCALE);
  await Promise.all(flights);
  $('#tStars').textContent = S.starBank;
  // poof!
  overlayPuff(tgt[0], tgt[1], 22, '#f6eedc', 16); overlayPuff(tgt[0], tgt[1] + 10, 10, '#e8d8b8', 12); overlaySparkle(tgt[0], tgt[1], 10, null, 40); SFX.dust(); vibrate(25);
  box.classList.remove('shakeA'); void box.offsetWidth; box.classList.add('shakeA');
  await wait(260);
  apply(); renderValley();
  const el2 = id && box.querySelector(`[data-id="${id}"]`);
  for (const k of Object.keys(t.set || {})) { const e = box.querySelector(`[data-id="${k}"]`); if (e) e.classList.add('restoring'); }
  const p2 = el2 ? centerOf(el2.querySelector('img') || el2) : tgt;
  overlaySparkle(p2[0], p2[1], 26, null, 60); SFX.levelUp(); confetti(110);
  setTimeout(() => SFX.sparkle(), 300 * TIME_SCALE);
  await wait(1000);
  box.style.transform = ''; box.style.transformOrigin = '';
  setTimeout(() => box.classList.remove('zoomTo'), 750 * TIME_SCALE);
  await wait(300);
}

// ---------- the top bar counts up instead of jumping ----------
const TOPV = { stars: null, coins: null, gems: null };
function tweenTop(key, el, pillSel, to) {
  const from = TOPV[key];
  TOPV[key] = to;
  if (from == null || from === to || CUR !== 'scrValley') { el.textContent = to.toLocaleString(); return; }
  const t0 = performance.now(), dur = Math.min(900, 300 + Math.abs(to - from) * 8);
  let lastTick = 0, n = 0;
  const step = now => {
    if (TOPV[key] !== to) return;
    const k = Math.min(1, (now - t0) / dur), v = Math.round(from + (to - from) * easeOut(k));
    el.textContent = v.toLocaleString();
    if (to > from && now - lastTick > 60) { lastTick = now; SFX.coinTick(n++); }
    if (k < 1) requestAnimationFrame(step); else bump(pillSel);
  };
  requestAnimationFrame(step);
}

function closePop() { $('#pop').classList.remove('on'); $('#pop').innerHTML = ''; }
function ask(html, buttons, cls) {
  return new Promise(res => {
    const el = popup(html + `<div class="btns">${buttons.map(b => `<button class="btn ${b.cls || ''}" data-v="${b.v}">${b.label}</button>`).join('')}</div>`, cls);
    el.querySelectorAll('[data-v]').forEach(b => b.addEventListener('click', () => { SFX.click(); closePop(); res(b.dataset.v); }));
  });
}
function toast(s) { const t = $('#toast'); t.textContent = s; t.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), 2400); }
function img(key, cls, px) { return `<img class="${cls || ''}" src="${icon(key, px)}" alt="">`; }
function updateTop() {
  const tb = $('#topbar'); if (!tb) return;
  tweenTop('stars', $('#tStars'), '#pStars', S.starBank); tweenTop('coins', $('#tCoins'), '#pCoins', S.coins); tweenTop('gems', $('#tGems'), '#pGems', S.gems);
}
function bump(sel) { const e = $(sel); if (!e) return; e.classList.remove('bump'); void e.offsetWidth; e.classList.add('bump'); }
function vibrate(ms) { try { if (S.vib !== false && navigator.vibrate) navigator.vibrate(ms); } catch (e) {} }

// ---------- confetti (DOM-free, on its own canvas) ----------
const FX = { cv: null, cx: null, parts: [] };
function confetti(n) {
  if (S.battery) n = Math.round(n / 2);
  if (!FX.cv) { FX.cv = $('#fxcv'); FX.cx = FX.cv.getContext('2d'); }
  const cols = ['#ff4d5e', '#ffd23a', '#56c43a', '#4f9dff', '#a35cff', '#ff9a1f'];
  for (let i = 0; i < n; i++) FX.parts.push({ x: window.innerWidth * (0.2 + Math.random() * 0.6), y: window.innerHeight * 0.35, vx: (Math.random() - 0.5) * 900, vy: -300 - Math.random() * 700, r: 4 + Math.random() * 5, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 14, col: cols[i % cols.length], age: 0, life: 1.8 + Math.random() });
}
// little twinkles on the overlay canvas, for HUD and valley moments
function overlaySparkle(x, y, n, cols, spread) {
  if (!FX.cv) { FX.cv = $('#fxcv'); FX.cx = FX.cv.getContext('2d'); }
  if (S.battery) n = Math.ceil(n / 2);
  cols = cols || ['#fff6b0', '#ffe14d', '#fff'];
  for (let i = 0; i < n; i++) { const a = Math.random() * TAU, sp = 40 + Math.random() * 160; FX.parts.push({ kind: 'spark', x: x + Math.cos(a) * (spread || 0) * Math.random(), y: y + Math.sin(a) * (spread || 0) * Math.random(), vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r: 6 + Math.random() * 8, rot: Math.random(), vr: 0, col: cols[i % cols.length], age: 0, life: 0.5 + Math.random() * 0.4 }); }
}
function overlayPuff(x, y, n, col, size) {
  if (!FX.cv) { FX.cv = $('#fxcv'); FX.cx = FX.cv.getContext('2d'); }
  for (let i = 0; i < n; i++) { const a = Math.random() * TAU, sp = 30 + Math.random() * 110; FX.parts.push({ kind: 'puff', x: x + Math.cos(a) * 10, y: y + Math.sin(a) * 6, vx: Math.cos(a) * sp * 1.8, vy: Math.sin(a) * sp * 0.7 - 25, r: (size || 18) * (0.6 + Math.random() * 0.7), rot: 0, vr: 0, col: col || '#fff', age: 0, life: 0.7 + Math.random() * 0.5 }); }
}
function drawConfetti(dt) {
  if (!FX.parts.length || !FX.cv) return;
  const W = window.innerWidth, H = window.innerHeight, d = Math.min(2, window.devicePixelRatio || 1);
  if (FX.cv.width !== Math.round(W * d)) { FX.cv.width = Math.round(W * d); FX.cv.height = Math.round(H * d); FX.cv.style.width = W + 'px'; FX.cv.style.height = H + 'px'; }
  const c = FX.cx; c.setTransform(d, 0, 0, d, 0, 0); c.clearRect(0, 0, W, H);
  for (const p of FX.parts) {
    p.age += dt; const k = p.age / p.life;
    if (p.kind === 'spark' || p.kind === 'puff') {
      const dr = Math.exp(-dt * 3); p.vx *= dr; p.vy *= dr; p.x += p.vx * dt; p.y += p.vy * dt;
      c.save(); c.fillStyle = p.col;
      if (p.kind === 'spark') { c.globalCompositeOperation = 'lighter'; const s = p.r * Math.sin(Math.min(1, k) * Math.PI); star(c, p.x, p.y, s, s * 0.22, 4, p.rot); c.fill(); }
      else { c.globalAlpha = Math.max(0, 0.9 * (1 - k * k)); circ(c, p.x, p.y, p.r * (1 + k * 1.5)); c.fill(); c.globalAlpha *= 0.5; c.lineWidth = 2; c.strokeStyle = 'rgba(120,90,60,.5)'; c.stroke(); }
      c.restore(); continue;
    }
    p.vy += 900 * dt; p.vx *= 0.99; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt; c.save(); c.globalAlpha = Math.max(0, 1 - p.age / p.life); c.translate(p.x, p.y); c.rotate(p.rot); c.fillStyle = p.col; c.fillRect(-p.r, -p.r * 0.5 * Math.abs(Math.cos(p.rot * 1.7)), p.r * 2, p.r * Math.abs(Math.cos(p.rot * 1.7)) + 0.5); c.restore();
  }
  FX.parts = FX.parts.filter(p => p.age < p.life && p.y < H + 40);
  if (!FX.parts.length) c.clearRect(0, 0, W, H);
}

// ---------- title ----------
function buildTitle() {
  const word = (w, cols) => w.split('').map((ch, i) => `<span style="color:${cols[i % cols.length]};animation-delay:${i * 0.12}s">${ch}</span>`).join('');
  $('#logo').innerHTML = `<div class="l1 stk2">${word('Harvest', ['#ff4d4d', '#ff9a1f', '#ffd23a', '#5cc93a', '#4f7dff', '#a35cff', '#ff4d4d'])}</div><div class="l2 stk2">${word('Pop!', ['#ffd23a', '#ff9a1f', '#ff4d4d', '#5cc93a'])}</div><div class="tsub stk">Harvest Hollow</div>`;
  $('#titleArt').innerHTML = `${img('rosie', 'tRosie', 180)}${img('fox', 'tFox', 180)}${img('crow', 'tCrow', 180)}<div class="tCrops">${[0, 1, 2, 3, 4, 5].map(k => img('c' + k, '', 112)).join('')}</div>`;
}
function refreshTitle() { $('#btnPlay').textContent = S.lvl > 1 || S.starsEver ? 'Play' : 'Start'; }

// ---------- settings ----------
function openSettings() {
  const row = (k, label, on) => `<div class="setRow"><span>${label}</span><button class="tgl ${on ? 'on' : ''}" data-t="${k}" aria-label="${label}"><i></i></button></div>`;
  const el = popup(`<button class="xbtn" data-x>${SVG.close}</button><div class="ribbon stk">Settings</div>
    <div class="setList">${row('snd', 'Sound effects', S.snd)}${row('music', 'Music', S.music)}${row('vib', 'Vibration', S.vib)}${row('battery', 'Battery saver', S.battery)}</div>
    <div class="btns col"><button class="btn blue" data-save>Save code</button><button class="btn" data-how>How to play</button><button class="btn red" data-reset>Start over</button></div>
    <div class="cloud ${CLOUD.on ? 'on' : ''}">${CLOUD.on ? 'Cloud save is on. Your farm follows you to any device where you\'re signed in.' : 'Progress is saved on this device. Use a save code to move it to another phone.'}</div>
    <div class="ver">Harvest Pop ${GAME_VER} &middot; Harvest Hollow</div>`);
  el.querySelector('[data-x]').onclick = () => { SFX.click(); closePop(); };
  el.querySelectorAll('[data-t]').forEach(b => b.onclick = () => {
    const k = b.dataset.t; S[k] = !S[k]; b.classList.toggle('on', S[k]); SFX.init(); SFX.resume(); SFX.applyVol();
    if (k === 'music' && S.music) MUSIC.start();
    if (k === 'battery' && G) layout();
    saveGame(); SFX.click();
  });
  el.querySelector('[data-save]').onclick = () => { SFX.click(); openSaveCode(); };
  el.querySelector('[data-how]').onclick = () => { SFX.click(); openHowTo(); };
  el.querySelector('[data-reset]').onclick = async () => {
    const v = await ask(`<div class="ribbon red stk">Start Over?</div><p>This erases your farm, your levels and everything you've collected. This can't be undone.</p>`, [{ label: 'Erase it', v: 'y', cls: 'red' }, { label: 'Keep playing', v: 'n' }]);
    if (v !== 'y') return;
    S = defaultSave(); saveGame(); writeSave(); location.reload();
  };
}
function openHowTo() {
  const rows = [['c0', 'Match 3', 'Swap neighboring crops to line up 3 or more.'], ['hoeH', 'Garden Hoe', '4 in a row. Digs a whole line.'], ['beeP', 'Bumblebee', '2x2 square. Flies to your goals.'], ['seedbomb', 'Seed Bomb', 'L or T shape. Bursts twice.'], ['sunflower', 'Sunflower', '5 in a row. Clears one crop.'], ['star', 'Stars', 'Win levels for 1 to 3 stars. Spend them to restore the valley.']];
  const el = popup(`<button class="xbtn" data-x>${SVG.close}</button><div class="ribbon stk">How to Play</div><div class="howList">${rows.map(([ic, t, d]) => `<div class="how">${img(ic, '', 112)}<div><b>${t}</b><span>${d}</span></div></div>`).join('')}</div><p class="small">Swap two power-ups together for a giant combo!</p>`);
  el.querySelector('[data-x]').onclick = () => { SFX.click(); closePop(); };
}
const saveCode = () => btoa(unescape(encodeURIComponent(JSON.stringify(S))));
function openSaveCode() {
  const el = popup(`<button class="xbtn" data-x>${SVG.close}</button><div class="ribbon stk">Save Code</div>
    <p class="small">Copy this code to keep a backup, or paste it on another phone to bring your farm along.</p>
    <textarea class="saveBox" readonly>${saveCode()}</textarea><div class="btns"><button class="btn" data-copy>Copy code</button></div>
    <div class="sub small">Load a save</div><textarea class="saveBox" data-in placeholder="Paste a save code here"></textarea>
    <div class="btns"><button class="btn orange" data-load>Load this save</button></div>`);
  el.querySelector('[data-x]').onclick = () => { SFX.click(); closePop(); };
  el.querySelector('[data-copy]').onclick = async () => { const ta = el.querySelector('.saveBox'); ta.select(); try { await navigator.clipboard.writeText(ta.value); toast('Save code copied!'); } catch (e) { toast('Code selected. Copy it now!'); } };
  el.querySelector('[data-load]').onclick = async () => {
    const raw = el.querySelector('[data-in]').value.trim(); if (!raw) { toast('Paste a save code first!'); return; }
    let d; try { d = JSON.parse(decodeURIComponent(escape(atob(raw)))); } catch (e) { toast('That code does not look right.'); return; }
    if (!d || d.v !== 2) { toast('That code does not look right.'); return; }
    const ok = await ask(`<div class="ribbon red stk">Load Save?</div><p>This replaces your current farm with the one at <b>level ${d.lvl}</b>.</p>`, [{ label: 'Load it', v: 'y', cls: 'red' }, { label: 'Cancel', v: 'n', cls: 'gray' }]);
    if (ok !== 'y') return;
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(d)); } catch (e) {}
    location.reload();
  };
}

// ---------- boot ----------
function boot() {
  loadGame();
  buildTitle(); refreshTitle();
  $('#btnSet').innerHTML = SVG.gear; $('#btnPause').innerHTML = SVG.pause;
  $('#btnPlay').onclick = () => { SFX.init(); SFX.resume(); SFX.click(); MUSIC.start(); enterValley(); };
  $('#btnSet').onclick = () => { SFX.click(); openSettings(); };
  $('#btnPause').onclick = () => { if (!G) return; SFX.click(); pauseMenu(); };
  $$('#gameBottom [data-tool]').forEach(b => (b.onclick = () => toggleTool(b.dataset.tool)));
  $$('img[data-ic]').forEach(i => (i.src = icon(i.dataset.ic, 112)));
  $('#iStar').src = icon('star', 64); $('#iCoin').src = icon('coin', 64); $('#iGem').src = icon('gem', 64);
  $('#btnTasks').onclick = () => { SFX.click(); openTasks(); };
  $('#btnAreas').onclick = () => { SFX.click(); openAreas(); };
  $('#btnKitchen').onclick = () => { SFX.click(); openKitchen(); };
  $('#btnBarn').onclick = () => { SFX.click(); openBarn(); };
  $('#btnDaily').onclick = () => { SFX.click(); openDaily(); };
  $('#btnRaid').onclick = () => { SFX.click(); openRaid(); };
  $('#vWx').onclick = () => { SFX.click(); openWeather(); };
  $('#btnLevel').onclick = () => { SFX.click(); if (S.lvl > LAST_LEVEL) openLevelBook(); else if (areaIdx(S.lvl) > unlockedArea()) openTasks(); else openLevel(S.lvl); };
  installAudioUnlock();
  window.addEventListener('resize', () => { if (G) layout(); else if (CUR === 'scrValley') { renderValley(); lifeLayout(); } });
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { if (CUR === 'scrValley') { awayCheck(); renderValley(); } } else { S.lastSeen = Date.now(); saveGame(); } });
  layout();
  show('scrTitle');
  let last = performance.now();
  const loop = now => {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (CUR === 'scrGame' && G) draw(dt * ANIM_SPEED);
    if (CUR === 'scrValley') lifeTick(dt);
    drawConfetti(dt);
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
  cloudInit();
  setTimeout(() => { try { prewarmIcons(); } catch (e) {} }, 800);
  setInterval(() => { if (CUR === 'scrValley') valleyTick(); }, 1000);
}
function pauseMenu() {
  const el = popup(`<div class="ribbon stk">Paused</div><div class="sub">${G.def.name || ''}</div>
    <div class="btns col"><button class="btn" data-r>Resume</button><button class="btn blue" data-s>Settings</button><button class="btn red" data-q>Quit level</button></div>`);
  el.querySelector('[data-r]').onclick = () => { SFX.click(); closePop(); };
  el.querySelector('[data-s]').onclick = () => { SFX.click(); openSettings(); };
  el.querySelector('[data-q]').onclick = async () => {
    if (G && G.started && G.mode === 'level') { const v = await ask(`<div class="ribbon red stk">Quit?</div><p>You'll lose your progress on this level.</p>`, [{ label: 'Quit', v: 'y', cls: 'red' }, { label: 'Keep playing', v: 'n' }]); if (v !== 'y') return; S.fails[G.def.n] = (S.fails[G.def.n] || 0) + 1; saveGame(); }
    SFX.click(); quitLevel();
  };
}

if (document.fonts && document.fonts.load) document.fonts.load('20px "Lilita One"').finally(boot); else boot();

</script>
